    /* =====================================
       PARSEAR MENSAJE
    ====================================== */

    function parseStoredMessage(
        message
    ) {

        if (
            typeof message !== "string"
        ) {

            return {
                text: "",
                reply: null,
                image: null
            };

        }

        try {

            const parsed =
                JSON.parse(message);

            if (
                parsed &&
                parsed.__chat === true &&
                typeof parsed.message === "string"
            ) {

                return {

                    text:
                        parsed.message,

                    reply:
                        parsed.reply || null,

                    image:
                        parsed.image || null

                };

            }

        } catch (error) {

            /* Mensaje normal */

        }

        return {

            text:
                message,

            reply:
                null,

            image:
                null

        };

    }


    /* =====================================
       VALIDAR URL DE IMAGEN
    ====================================== */

    function isValidImageUrl(
        url
    ) {

        try {

            const parsed =
                new URL(url);

            return (
                parsed.protocol === "http:" ||
                parsed.protocol === "https:"
            );

        } catch {

            return false;

        }

    }

    /* =====================================
       HORA
    ====================================== */

    function getMessageDate(
        timestamp
    ) {

        if (!timestamp) {

            return new Date();

        }

        const value =
            String(timestamp).trim();

        const hasTimezone =
            /(?:Z|[+-]\d{2}:?\d{2})$/i
                .test(value);

        const normalizedValue =
            hasTimezone
                ? value
                : value + "Z";

        const date =
            new Date(
                normalizedValue
            );

        if (
            Number.isNaN(
                date.getTime()
            )
        ) {

            return new Date(timestamp);

        }

        return date;

    }


    function formatMessageTime(
        timestamp
    ) {

        const date =
            getMessageDate(timestamp);

        return new Intl.DateTimeFormat(
            undefined,
            {
                hour: "2-digit",
                minute: "2-digit",
                hour12: false
            }
        ).format(date);

    }


    /* =====================================
       MOSTRAR MENSAJE
    ====================================== */

    function addMessageToScreen(
        message,
        fromRealtime = false
    ) {

        if (
            message.id &&
            messages.querySelector(
                `[data-message-id="${message.id}"]`
            )
        ) {

            return;

        }

        const element =
            document.createElement("div");

        element.classList.add(
            "message"
        );

        if (message.id) {

            element.dataset.messageId =
                message.id;

        }

        const isMine =
            message.username === username;

        if (isMine) {

            element.classList.add(
                "mine"
            );

        }

        const parsed =
            parseStoredMessage(
                message.message
            );


        /* NOMBRE */

        const nameWrap =
            document.createElement("div");

        nameWrap.classList.add(
            "name-wrap"
        );

        const starLeft =
            document.createElement("span");

        starLeft.classList.add(
            "star"
        );

        starLeft.textContent =
            "✦";

        const starSmall =
            document.createElement("span");

        starSmall.classList.add(
            "star",
            "small"
        );

        starSmall.textContent =
            "✧";

        const name =
            document.createElement("div");

        name.classList.add(
            "name"
        );

        name.textContent =
            message.username;

        const starRight =
            document.createElement("span");

        starRight.classList.add(
            "star"
        );

        starRight.textContent =
            "✦";

        nameWrap.appendChild(starLeft);
        nameWrap.appendChild(starSmall);
        nameWrap.appendChild(name);
        nameWrap.appendChild(starRight);

        element.appendChild(
            nameWrap
        );


        /* REPLY */

        if (
            parsed.reply &&
            parsed.reply.username
        ) {

            const reply =
                document.createElement("div");

            reply.classList.add(
                "message-reply"
            );

            const replyAuthor =
                document.createElement("strong");

            replyAuthor.textContent =
                "↩ " +
                parsed.reply.username;

            const replyText =
                document.createElement("span");

            replyText.textContent =
                parsed.reply.message ||
                "Mensaje";

            reply.appendChild(
                replyAuthor
            );

            reply.appendChild(
                replyText
            );

            element.appendChild(
                reply
            );

        }


        /* TEXTO */

        if (parsed.text) {

            const text =
                document.createElement("div");

            text.classList.add(
                "text"
            );

            text.textContent =
                parsed.text;

            element.appendChild(
                text
            );

        }


        /* IMAGEN */

        if (
            parsed.image &&
            isValidImageUrl(
                parsed.image
            )
        ) {

            const image =
                document.createElement("img");

            image.classList.add(
                "message-image"
            );

            image.src =
                parsed.image;

            image.alt =
                "Imagen enviada por " +
                message.username;

            image.loading =
                "lazy";

            image.referrerPolicy =
                "no-referrer";

            image.addEventListener(
                "error",
                () => {

                    image.remove();

                    const failed =
                        document.createElement(
                            "div"
                        );

                    failed.classList.add(
                        "image-loading"
                    );

                    failed.textContent =
                        "⚠️ No se pudo cargar la imagen.";

                    element.insertBefore(
                        failed,
                        time
                    );

                }
            );

            image.addEventListener(
                "click",
                () => {

                    window.open(
                        parsed.image,
                        "_blank",
                        "noopener,noreferrer"
                    );

                }
            );

            element.appendChild(
                image
            );

        }


        /* HORA */

        const time =
            document.createElement("span");

        time.classList.add(
            "time"
        );

        time.textContent =
            formatMessageTime(
                message.created_at
            );

        element.appendChild(
            time
        );


        /* HERRAMIENTAS */

        const tools =
            document.createElement("div");

        tools.classList.add(
            "message-tools"
        );


        /* RESPONDER */

        const replyButton =
            document.createElement("button");

        replyButton.type =
            "button";

        replyButton.classList.add(
            "reply-button"
        );

        replyButton.textContent =
            "↩ Responder";

        replyButton.addEventListener(
            "click",
            () => {

                startReply({

                    id:
                        message.id,

                    username:
                        message.username,

                    message:
                        parsed.text ||
                        (
                            parsed.image
                                ? "🖼️ Imagen"
                                : "Mensaje"
                        )

                });

            }
        );

        tools.appendChild(
            replyButton
        );


        /* BORRAR */

        if (
            isMine &&
            message.id &&
            !String(message.id).startsWith(
                "local-"
            )
        ) {

            const deleteButton =
                document.createElement(
                    "button"
                );

            deleteButton.type =
                "button";

            deleteButton.classList.add(
                "delete-button"
            );

            deleteButton.textContent =
                "🗑️ Borrar";

            deleteButton.title =
                "Borrar este mensaje";

            deleteButton.addEventListener(
                "click",
                async () => {

                    await deleteMessage(

                    );

                }
            );

            tools.appendChild(
                deleteButton
            );

        }


        element.appendChild(
            tools
        );


        messages.appendChild(
            element
        );


        /* NOTIFICACION */

        if (
            fromRealtime &&
            message.username !== username
        ) {

            notifyIncomingMessage(
                message
            );

        }

        scrollToBottom();

    }

    /* =====================================

    ====================================== */

    imageInput.addEventListener(
        "change",
        async event => {

            const file =
                event.target.files[0];

            if (!file) {

                return;

            }


            if (
                !file.type.startsWith(
                    "image/"
                )
            ) {

                alert(
                    "Ese archivo no parece ser una imagen."
                );

                imageInput.value =
                    "";

                return;

            }


            /*
             * Limite de 10 MB
             */

            if (
                file.size >
                10 * 1024 * 1024
            ) {

                alert(
                    "La imagen es demasiado grande. Máximo: 10 MB."
                );

                imageInput.value =
                    "";

                return;

            }


            imageButton.classList.add(
                "uploading"
            );

            imageButton.textContent =
                "⏳";

            imageButton.title =
                "Subiendo imagen...";


            try {

                const extension =
                    file.name
                        .split(".")
                        .pop()
                        .toLowerCase();


                const safeUsername =
                    username
                        .replace(
                            /[^a-zA-Z0-9_-]/g,
                            "_"
                        );


                const fileName =
                    Date.now() +
                    "_" +
                    Math.random()
                        .toString(36)
                        .slice(2) +
                    "_" +
                    safeUsername +
                    "." +
                    extension;


                const filePath =
                    chatId +
                    "/" +
                    fileName;


                const {
                    error:
                        uploadError
                } =
                    await supabaseClient
                        .storage
                        .from(
                            STORAGE_BUCKET
                        )
                        .upload(
                            filePath,
                            file,
                            {
                                cacheControl:
                                    "3600",

                                upsert:
                                    false,

                                contentType:
                                    file.type
                            }
                        );


                if (uploadError) {

                    console.error(
                        "Error subiendo imagen:",
                        uploadError
                    );

                    alert(
                        "No se pudo subir la imagen.\n\n" +
                        uploadError.message
                    );

                    return;

                }


                /*
                 * Obtener URL pública
                 */

                const {
                    data:
                        publicData
                } =
                    supabaseClient
                        .storage
                        .from(
                            STORAGE_BUCKET
                        )
                        .getPublicUrl(
                            filePath
                        );


                if (
                    !publicData ||
                    !publicData.publicUrl
                ) {

                    alert(
                        "La imagen se subió, pero no se pudo obtener su URL."
                    );

                    return;

                }


                pendingImageUrl =
                    publicData.publicUrl;


                imageButton.textContent =
                    "✅";

                imageButton.title =
                    "Imagen preparada para enviar";


                messageInput.placeholder =
                    "Escribe algo o envía la imagen...";


                messageInput.focus();


                showNotificationStatus(
                    "🖼️ Imagen preparada para enviar"
                );

            } catch (error) {

                console.error(
                    "Error inesperado subiendo imagen:",
                    error
                );

                alert(
                    "Ocurrió un error al subir la imagen."
                );

            } finally {

                imageButton.classList.remove(
                    "uploading"
                );

                imageInput.value =
                    "";

                if (!pendingImageUrl) {

                    imageButton.textContent =
                        "🖼️";

                    imageButton.title =
                        "Enviar imagen";

                }

            }

        }
    );

    /* =====================================
       BORRAR UN MENSAJE
    ====================================== */

    async function deleteMessage(
        message,
        element
    ) {

        if (
            !message.id ||
            String(message.id).startsWith(
                "local-"
            )
        ) {

            return;

        }


        if (
            message.username !== username
        ) {

            alert(
                "Solo puedes borrar tus propios mensajes."
            );

            return;

        }


        const confirmed =
            confirm(
                "¿Quieres borrar este mensaje?"
            );


        if (!confirmed) {

            return;

        }


        const parsed =
            parseStoredMessage(
                message.message
            );


        const {
            error
        } =
            await supabaseClient
                .from("messages")
                .delete()
                .eq(
                    "id",
                    message.id
                )
                .eq(
                    "username",
                    username
                );


        if (error) {

            console.error(
                "Error borrando mensaje:",
                error
            );

            alert(
                "No se pudo borrar el mensaje.\n\n" +
                error.message
            );

            return;

        }


        /*
         * Intentar borrar también
         * la imagen del Storage.
         */

        if (parsed.image) {

            await deleteStorageImage(
                parsed.image
            );

        }


        element.remove();


        showNotificationStatus(
            "🗑️ Mensaje borrado"
        );

    }


    /* =====================================
       BORRAR IMAGEN DE STORAGE
    ====================================== */

    async function deleteStorageImage(
        imageUrl
    ) {

        try {

            const marker =
                "/storage/v1/object/public/" +
                STORAGE_BUCKET +
                "/";


            const index =
                imageUrl.indexOf(
                    marker
                );


            if (index === -1) {

                return;

            }


            const filePath =
                decodeURIComponent(
                    imageUrl.slice(
                        index +
                        marker.length
                    )
                );


            if (!filePath) {

                return;

            }


            const {
                error
            } =
                await supabaseClient
                    .storage
                    .from(
                        STORAGE_BUCKET
                    )
                    .remove([
                        filePath
                    ]);


            if (error) {

                console.warn(
                    "No se pudo borrar la imagen del Storage:",
                    error
                );

            }

        } catch (error) {

            console.warn(
                "Error eliminando imagen del Storage:",
                error
            );

        }

    }

                } =
                    await supabaseClient
                        .from("messages")
                        .select(
                            "id,message,chat_id"
                        )
                        .eq(
                            "chat_id",
                            chatId
                        );


                if (selectError) {

                    throw selectError;

                }


                /*
                 * Borrar mensajes.
                 */

                const {
                    error:
                        deleteError
                } =
                    await supabaseClient
                        .from("messages")
                        .delete()
                        .eq(
                            "chat_id",
                            chatId
                        );


                if (deleteError) {

                    throw deleteError;

                }


                /*
                 * Intentar borrar imágenes.
                 */

                if (existingMessages) {

                    for (
                        const item
                        of existingMessages
                    ) {

                        const parsed =
                            parseStoredMessage(
                                item.message
                            );


                        if (parsed.image) {

                            await deleteStorageImage(

                            );

                        }

                );

                alert(
                    "No se pudo vaciar el chat.\n\n" +

                );

            } finally {

                clearChatButton.disabled =
                    false;

                clearChatButton.textContent =
                    "🧹";

            }

        }
    );


    /* =====================================
       NOTIFICACIONES
    ====================================== */

    async function requestNotificationPermission() {

        if (
            !("Notification" in window)
        ) {

            return;

        }


        if (
            Notification.permission ===
            "default"
        ) {

            try {

                const permission =
                    await Notification.requestPermission();

                if (
                    permission === "granted"
                ) {

                    showNotificationStatus(
                        "🔔 Notificaciones activadas"
                    );

                }

            } catch (error) {

                console.warn(
                    "No se pudo solicitar permiso:",
                    error
                );

            }

        }

    }


    function showNotificationStatus(
        text
    ) {

        notificationStatus.textContent =
            text;

        notificationStatus.classList.add(
            "show"
        );

        clearTimeout(
            showNotificationStatus.timer
        );

        showNotificationStatus.timer =
            setTimeout(
                () => {

                    notificationStatus.classList.remove(
                        "show"
                    );

                },
                3000
            );

    }


    function notifyIncomingMessage(
        message
    ) {

        flashDocumentTitle();


        if (
            !("Notification" in window)
        ) {

            return;

        }


        if (
            Notification.permission !==
            "granted"
        ) {

            return;

        }


        if (!document.hidden) {

            return;

        }


        const parsed =
            parseStoredMessage(
                message.message
            );


        let body =
            parsed.text ||
            (
                parsed.image
                    ? "🖼️ Nueva imagen"
                    : "Nuevo mensaje"
            );


        if (
            parsed.reply &&
            parsed.reply.username
        ) {

            body =
                "↩ Respondió a " +
                parsed.reply.username +
                ": " +
                body;

        }


        if (
            body.length > 100
        ) {

            body =
                body.slice(0, 97) +
                "...";

        }


        try {

            const notification =
                new Notification(
                    "Mi otra mitad · " +
                    message.username,
                    {
                        body:
                            body,

                        tag:
                            "chat-" +
                            chatId
                    }
                );


            notification.onclick =
                () => {

                    window.focus();

                    notification.close();

                };

        } catch (error) {

            console.warn(
                "No se pudo mostrar notificación:",
                error
            );

        }

    }


    function flashDocumentTitle() {

        clearInterval(
            titleFlashTimer
        );

        let visible =
            false;

        let count =
            0;


        titleFlashTimer =
            setInterval(
                () => {

                    visible =
                        !visible;

                    count++;


                    document.title =
                        visible
                            ? "💙 Nuevo mensaje"
                            : notificationTitle;


                    if (count >= 8) {

                        clearInterval(
                            titleFlashTimer
                        );

                        document.title =
                            notificationTitle;

                    }

                },
                700
            );

    }


    /* =====================================
       TIEMPO REAL
    ====================================== */

    function subscribeToMessages() {

        supabaseClient

            .channel(
                "messages-" +
                chatId
            )

            .on(
                "postgres_changes",
                {
                    event:
                        "INSERT",

                    schema:
                        "public",

                    table:
                        "messages",

                    filter:
                        "chat_id=eq." +
                        chatId
                },

                payload => {

                    addMessageToScreen(
                        payload.new,
                        true
                    );

                }
            )

            /*
             * DELETE REALTIME
             *
             * Cuando otra persona borra
             * un mensaje, desaparece aquí también.
             */

            .on(
                "postgres_changes",
                {
                    event:
                        "DELETE",

                    schema:
                        "public",

                    table:
                        "messages",

                    filter:
                        "chat_id=eq." +
                        chatId
                },

                payload => {

                    if (!payload.old) {

                        return;

                    }


                    const deleted =
                        messages.querySelector(
                            `[data-message-id="${payload.old.id}"]`
                        );


                    if (deleted) {

                        deleted.remove();

                    }

                }
            )

            .subscribe(
                status => {

                    console.log(
                        "Estado Realtime:",
                        status
                    );

                }
            );

    }


    /* =====================================
       AUDIO WEBRTC
    ====================================== */

    async function setupAudioChannel() {

        audioChannel =
            supabaseClient.channel(
                "audio-" +
                chatId,
                {
                    config: {

                        presence: {

                            key:
                                crypto.randomUUID()

                        }

                    }

                }
            );


        audioChannel

            .on(
                "presence",
                {
                    event:
                        "sync"
                },
                handlePresenceSync
            )

            .on(
                "presence",
                {
                    event:
                        "join"
                },
                handlePresenceJoin
            )

            .on(
                "broadcast",
                {
                    event:
                        "webrtc"
                },

                async ({
                    payload
                }) => {

                    if (!payload) {

                        return;

                    }

                    await handleWebRTCSignal(
                        payload
                    );

                }
            );


        await audioChannel.subscribe(
            async status => {

                if (
                    status ===
                    "SUBSCRIBED"
                ) {

                    await audioChannel.track(
                        {
                            username:
                                username,

                            joinedAt:
                                Date.now()
                        }
                    );


                    setAudioStatus(
                        "Audio listo · micrófono apagado"
                    );

                }

            }
        );

    }


    function getPresenceCount() {

        if (!audioChannel) {

            return 0;

        }

        const state =
            audioChannel.presenceState();

        return Object.keys(
            state
        ).length;

    }


    async function handlePresenceSync() {

        remotePeerPresent =
            getPresenceCount() > 1;

        if (
            remotePeerPresent &&
            audioStarted
        ) {

            await ensurePeerConnection();

            if (!makingOffer) {

                await createOffer();

            }

        }

    }


    async function handlePresenceJoin() {

        remotePeerPresent =
            true;

        if (audioStarted) {

            await ensurePeerConnection();

            if (!makingOffer) {

                await createOffer();

            }

        }

    }


    /* =====================================
       PEER CONNECTION
    ====================================== */

    async function ensurePeerConnection() {

        if (peerConnection) {

            return peerConnection;

        }


        peerConnection =
            new RTCPeerConnection(
                rtcConfig
            );


        peerConnection.onicecandidate =
            async event => {

                if (!event.candidate) {

                    return;

                }


                await sendSignal({

                    type:
                        "candidate",

                    candidate:
                        event.candidate

                });

            };


        peerConnection.ontrack =
            async event => {

                if (
                    event.streams &&
                    event.streams[0]
                ) {

                    remoteAudio.srcObject =
                        event.streams[0];

                } else {

                    remoteAudio.srcObject =
                        new MediaStream([
                            event.track
                        ]);

                }


                try {

                    await remoteAudio.play();

                } catch (error) {

                    console.warn(
                        "El navegador bloqueó el audio:",
                        error
                    );

                }


                setAudioStatus(
                    "🔊 Audio conectado",
                    true
                );

            };


        peerConnection.onconnectionstatechange =
            () => {

                if (!peerConnection) {

                    return;

                }


                const state =
                    peerConnection.connectionState;


                if (
                    state ===
                    "connected"
                ) {

                    setAudioStatus(
                        audioStarted
                            ? "🎙️ Micrófono activo · 🔊 audio conectado"
                            : "🔊 Audio conectado · micrófono apagado",
                        audioStarted
                    );

                }


                if (
                    state === "failed" ||
                    state === "disconnected"
                ) {

                    setAudioStatus(
                        "Reconectando audio..."
                    );

                }

            };


        if (localStream) {

            localStream
                .getTracks()
                .forEach(
                    track => {

                        peerConnection.addTrack(
                            track,
                            localStream
                        );

                    }
                );

        }


        return peerConnection;

    }


    /* =====================================
       MICROFONO
    ====================================== */

    async function getLocalMicrophone() {

        if (localStream) {

            return localStream;

        }


        try {

            localStream =
                await navigator
                    .mediaDevices
                    .getUserMedia({

                        audio: {

                            echoCancellation:
                                true,

                            noiseSuppression:
                                true,

                            autoGainControl:
                                true

                        },

                        video:
                            false

                    });


            localAudioTrack =
                localStream
                    .getAudioTracks()[0];


            localAudioTrack.enabled =
                false;


            return localStream;

        } catch (error) {

            console.error(
                "Error micrófono:",
                error
            );


            if (
                error.name ===
                "NotAllowedError"
            ) {

                alert(
                    "Necesitas permitir el micrófono en el navegador."
                );

            } else {

                alert(
                    "No se pudo acceder al micrófono."
                );

            }


            return null;

        }

    }


    /* =====================================
       BOTON LLAMADA
    ====================================== */

    micButton.addEventListener(
        "click",
        async () => {

            if (!audioChannel) {

                setAudioStatus(
                    "El audio todavía está conectando..."
                );

                return;

            }


            if (!localStream) {

                micButton.classList.add(
                    "waiting"
                );


                const stream =
                    await getLocalMicrophone();


                micButton.classList.remove(
                    "waiting"
                );


                if (!stream) {

                    return;

                }


                await ensurePeerConnection();

            }


            if (!localAudioTrack) {

                return;

            }


            localAudioTrack.enabled =
                !localAudioTrack.enabled;


            audioStarted =
                localAudioTrack.enabled;


            if (audioStarted) {

                micButton.classList.add(
                    "active"
                );


                micButton.textContent =
                    "🎙️";


                micButton.title =
                    "Apagar micrófono";


                micButton.setAttribute(
                    "aria-label",
                    "Apagar micrófono"
                );


                setAudioStatus(
                    remotePeerPresent
                        ? "🎙️ Micrófono activo · 🔊 conectado"
                        : "🎙️ Micrófono activo · esperando a la otra persona",
                    true
                );


                if (remotePeerPresent) {

                    await ensurePeerConnection();


                    if (!makingOffer) {

                        await createOffer();

                    }

                }

            } else {

                micButton.classList.remove(
                    "active"
                );


                micButton.textContent =
                    "📞";


                micButton.title =
                    "Activar micrófono";


                micButton.setAttribute(
                    "aria-label",
                    "Activar micrófono"
                );


                setAudioStatus(
                    "🔇 Micrófono apagado"
                );

            }

        }
    );


    /* =====================================
       OFFER
    ====================================== */

    async function createOffer() {

        if (
            !peerConnection ||
            !remotePeerPresent ||
            makingOffer
        ) {

            return;

        }


        try {

            makingOffer =
                true;


            const offer =
                await peerConnection
                    .createOffer();


            await peerConnection
                .setLocalDescription(
                    offer
                );


            await sendSignal({

                type:
                    "offer",

                description:
                    peerConnection.localDescription

            });

        } catch (error) {

            console.error(
                "Error creando offer:",
                error
            );

        } finally {

            makingOffer =
                false;

        }

    }


    /* =====================================
       SEÑAL
    ====================================== */

    async function sendSignal(
        data
    ) {

        if (!audioChannel) {

            return;

        }


        try {

            await audioChannel.send({

                type:
                    "broadcast",

                event:
                    "webrtc",

                payload:
                    data

            });

        } catch (error) {

            console.error(
                "Error señal WebRTC:",
                error
            );

        }

    }


    /* =====================================
       RECIBIR SEÑAL
    ====================================== */

    async function handleWebRTCSignal(
        payload
    ) {

        if (
            !payload ||
            !audioChannel
        ) {

            return;

        }


        try {

            if (
                payload.type ===
                "offer"
            ) {

                await ensurePeerConnection();


                await peerConnection
                    .setRemoteDescription(
                        new RTCSessionDescription(
                            payload.description
                        )
                    );


                const answer =
                    await peerConnection
                        .createAnswer();


                await peerConnection
                    .setLocalDescription(
                        answer
                    );


                await sendSignal({

                    type:
                        "answer",

                    description:
                        peerConnection.localDescription

                });

            }


            else if (
                payload.type ===
                "answer"
            ) {

                if (!peerConnection) {

                    return;

                }


                await peerConnection
                    .setRemoteDescription(
                        new RTCSessionDescription(
                            payload.description
                        )
                    );

            }


            else if (
                payload.type ===
                "candidate"
            ) {

                if (
                    !peerConnection ||
                    !payload.candidate
                ) {

                    return;

                }


                try {

                    await peerConnection
                        .addIceCandidate(
                            new RTCIceCandidate(
                                payload.candidate
                            )
                        );

                } catch (error) {

                    console.warn(
                        "Error ICE:",
                        error
                    );

                }

            }

        } catch (error) {

            console.error(
                "Error WebRTC:",
                error
            );

        }

    }


    /* =====================================
       LIMPIEZA
    ====================================== */

    window.addEventListener(
        "beforeunload",
        () => {

            if (localStream) {

                localStream
                    .getTracks()
                    .forEach(
                        track =>
                            track.stop()
                    );

            }


            if (peerConnection) {

                peerConnection.close();

            }


            if (audioChannel) {

                audioChannel.unsubscribe();

            }

        }
    );


    window.addEventListener(
        "focus",
        () => {

            clearInterval(
                titleFlashTimer
            );

            document.title =
                notificationTitle;

        }
    );


    /* =====================================
       SCROLL
    ====================================== */

    function scrollToBottom() {

        messages.scrollTop =
            messages.scrollHeight;

    }

</script>
