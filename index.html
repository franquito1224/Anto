<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Chat Privado 🌙</title>

    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --night: #061329;
            --night-2: #091a35;
            --night-3: #0d2345;
            --blue: #3d8eea;
            --blue-light: #8ed8ff;
            --bubble: #9bdcff;
            --bubble-2: #75c9f5;
            --text-dark: #08203d;
            --white-blue: #eaf8ff;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: var(--night);
            color: white;
            height: 100vh;
            overflow: hidden;
        }

        /* =========================
           FONDO DE CIELO NOCTURNO
        ========================== */

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            background:
                radial-gradient(circle at 15% 20%, rgba(74, 154, 255, .12), transparent 25%),
                radial-gradient(circle at 85% 75%, rgba(57, 202, 255, .10), transparent 28%),
                linear-gradient(145deg, #061329, #0a1c3b 50%, #041024);
            z-index: -2;
        }

        body::after {
            content: "✦     ·   ✧        ·       ⋆   ·          ✦\A"
                   "   ·        ✦       ·    ⋆       ✧       ·\A"
                   "✧       ·      ⋆         ·       ✦      ·\A"
                   "     ⋆       ·       ✧       ·       ⋆";
            white-space: pre;
            position: fixed;
            inset: 0;
            pointer-events: none;
            color: rgba(190, 231, 255, .42);
            font-size: 13px;
            line-height: 7;
            letter-spacing: 18px;
            padding: 10px 3%;
            opacity: .55;
            z-index: -1;
        }

        /* =========================
           PANTALLA DE ENTRADA
        ========================== */

        #login-screen {
            position: fixed;
            inset: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background:
                radial-gradient(circle at 50% 0%, rgba(64, 145, 235, .22), transparent 38%),
                linear-gradient(145deg, #061329, #091c3b 55%, #041024);
        }

        .login-box {
            width: min(90%, 420px);
            padding: 38px 34px;
            background: rgba(9, 27, 55, .92);
            border: 1px solid rgba(142, 216, 255, .22);
            border-radius: 24px;
            text-align: center;
            box-shadow:
                0 25px 80px rgba(0, 0, 0, .45),
                0 0 45px rgba(61, 142, 234, .10);
            backdrop-filter: blur(12px);
        }

        .login-icon {
            font-size: 42px;
            margin-bottom: 10px;
            filter: drop-shadow(0 0 12px rgba(142, 216, 255, .35));
        }

        .login-box h1 {
            font-size: 30px;
            margin-bottom: 10px;
        }

        .login-box p {
            color: #a9c8e5;
            margin-bottom: 25px;
            line-height: 1.5;
        }

        #username {
            width: 100%;
            padding: 14px 16px;
            background: #06162d;
            color: white;
            border: 1px solid #245282;
            border-radius: 13px;
            outline: none;
            font-size: 16px;
            margin-bottom: 15px;
            transition: .2s;
        }

        #username:focus {
            border-color: var(--blue-light);
            box-shadow: 0 0 0 3px rgba(142, 216, 255, .10);
        }

        #enter-button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 13px;
            background: linear-gradient(135deg, #3d8eea, #58b7f4);
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: .2s;
            box-shadow: 0 8px 22px rgba(61, 142, 234, .25);
        }

        #enter-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 28px rgba(61, 142, 234, .35);
        }

        /* =========================
           CHAT
        ========================== */

        #chat-screen {
            display: none;
            height: 100vh;
            width: 100%;
            flex-direction: column;
        }

        .chat-header {
            min-height: 70px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            background: rgba(5, 19, 42, .94);
            border-bottom: 1px solid rgba(142, 216, 255, .15);
            box-shadow: 0 5px 25px rgba(0, 0, 0, .18);
            backdrop-filter: blur(12px);
        }

        .chat-title {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .chat-icon {
            width: 42px;
            height: 42px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(145deg, #164f8d, #237bc2);
            border: 1px solid rgba(142, 216, 255, .25);
            border-radius: 50%;
            box-shadow: 0 0 20px rgba(61, 142, 234, .20);
        }

        .chat-title h2 {
            font-size: 18px;
        }

        .online {
            font-size: 12px;
            color: #8fc3e9;
        }

        .online::before {
            content: "●";
            color: #69d7ff;
            margin-right: 5px;
            text-shadow: 0 0 8px #69d7ff;
        }

        #current-user {
            color: #cceaff;
            font-size: 14px;
        }

        /* =========================
           MENSAJES
        ========================== */

        #messages {
            flex: 1;
            overflow-y: auto;
            padding: 24px 20px;
            display: flex;
            flex-direction: column;
            gap: 13px;
            background:
                radial-gradient(circle at 20% 15%, rgba(55, 130, 210, .08), transparent 25%),
                radial-gradient(circle at 80% 80%, rgba(75, 178, 240, .07), transparent 28%),
                #06152d;
            scroll-behavior: smooth;
        }

        #messages::-webkit-scrollbar {
            width: 8px;
        }

        #messages::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, .03);
        }

        #messages::-webkit-scrollbar-thumb {
            background: #174779;
            border-radius: 10px;
        }

        .message {
            max-width: 75%;
            padding: 11px 15px;
            border-radius: 17px 17px 17px 5px;
            background: linear-gradient(145deg, var(--bubble), #83d0f7);
            color: var(--text-dark);
            align-self: flex-start;
            border: 1px solid rgba(215, 246, 255, .55);
            box-shadow:
                0 7px 20px rgba(0, 0, 0, .18),
                0 0 18px rgba(117, 201, 245, .08);
            animation: messageIn .2s ease-out;
        }

        .message.mine {
            align-self: flex-end;
            border-radius: 17px 17px 5px 17px;
            background: linear-gradient(145deg, #b3e6ff, #83d1fa);
        }

        .name-wrap {
            display: flex;
            align-items: center;
            gap: 7px;
            margin-bottom: 4px;
            min-height: 18px;
        }

        .star {
            color: #fff8bd;
            font-size: 11px;
            text-shadow: 0 0 6px rgba(255, 248, 189, .9);
            line-height: 1;
        }

        .star.small {
            font-size: 8px;
            opacity: .8;
        }

        .message .name {
            font-size: 12px;
            font-weight: bold;
            color: #17466e;
        }

        .message .text {
            font-size: 15px;
            line-height: 1.45;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .message .time {
            display: block;
            text-align: right;
            font-size: 10px;
            color: #326080;
            margin-top: 6px;
        }

        /* MENSAJE DEL SISTEMA */

        .system-message {
            align-self: center;
            max-width: 90%;
            text-align: center;
            background: rgba(20, 54, 91, .45);
            color: #86b9dc;
            border: 1px solid rgba(134, 185, 220, .10);
            padding: 9px 14px;
            border-radius: 14px;
            box-shadow: none;
        }

        .system-message .name {
            color: #9fd5f3;
        }

        /* =========================
           CAJA DE MENSAJE
        ========================== */

        .message-area {
            display: flex;
            gap: 10px;
            padding: 13px 15px;
            background: rgba(7, 25, 52, .97);
            border-top: 1px solid rgba(142, 216, 255, .15);
            box-shadow: 0 -7px 25px rgba(0, 0, 0, .16);
        }

        #message-input {
            flex: 1;
            padding: 13px 16px;
            background: #2f72b8;
            color: white;
            border: 1px solid #5599d5;
            border-radius: 13px;
            outline: none;
            font-size: 15px;
            box-shadow: inset 0 2px 8px rgba(0, 0, 0, .12);
            transition: .2s;
        }

        #message-input::placeholder {
            color: rgba(235, 249, 255, .72);
        }

        #message-input:focus {
            background: #357ec6;
            border-color: #8ed8ff;
            box-shadow:
                0 0 0 3px rgba(142, 216, 255, .10),
                inset 0 2px 8px rgba(0, 0, 0, .12);
        }

        #send-button {
            width: 52px;
            border: none;
            border-radius: 13px;
            background: linear-gradient(145deg, #55b8f0, #3285d0);
            color: white;
            font-size: 21px;
            cursor: pointer;
            transition: .2s;
            box-shadow: 0 7px 18px rgba(50, 133, 208, .25);
        }

        #send-button:hover {
            transform: scale(1.05) rotate(-2deg);
            box-shadow: 0 10px 23px rgba(50, 133, 208, .35);
        }

        @keyframes messageIn {
            from {
                opacity: 0;
                transform: translateY(5px) scale(.98);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* =========================
           MÓVIL
        ========================== */

        @media (max-width: 600px) {
            .login-box {
                padding: 30px 22px;
            }

            .chat-header {
                padding: 0 12px;
            }

            #messages {
                padding: 15px 12px;
            }

            .message {
                max-width: 85%;
            }

            #current-user {
                display: none;
            }

            .message-area {
                padding: 10px;
            }

            #message-input {
                min-width: 0;
            }
        }
    </style>
</head>

<body>

    <!-- =========================
         ENTRADA
    ========================== -->

    <section id="login-screen">

        <div class="login-box">

            <div class="login-icon">🌙</div>

            <h1>Chat Privado</h1>

            <p>
                Elige el nombre que aparecerá
                junto a tus mensajes bajo este cielo nocturno ✦
            </p>

            <input
                type="text"
                id="username"
                maxlength="20"
                placeholder="Tu nombre..."
                autocomplete="off"
            >

            <button id="enter-button">
                Entrar al chat ✦
            </button>

        </div>

    </section>


    <!-- =========================
         CHAT
    ========================== -->

    <main id="chat-screen">

        <header class="chat-header">

            <div class="chat-title">

                <div class="chat-icon">
                    💬
                </div>

                <div>

                    <h2>
                        Chat Privado
                    </h2>

                    <span class="online">
                        Chat grupal
                    </span>

                </div>

            </div>

            <div id="current-user"></div>

        </header>


        <!-- MENSAJES -->

        <section id="messages">

            <div class="message system-message">

                <div class="name-wrap">
                    <span class="star">✦</span>
                    <div class="name">💬 Sistema</div>
                    <span class="star">✦</span>
                </div>

                <div class="text">
                    Bienvenido al chat 👋
                </div>

            </div>

        </section>


        <!-- ESCRIBIR -->

        <form
            class="message-area"
            id="message-form"
        >

            <input
                type="text"
                id="message-input"
                placeholder="Escribe un mensaje bajo las estrellas..."
                autocomplete="off"
            >

            <button
                type="submit"
                id="send-button"
                aria-label="Enviar mensaje"
            >
                ➤
            </button>

        </form>

    </main>


    <!-- =========================
         JAVASCRIPT
    ========================== -->

    <script>

        /* =====================================
           CONFIGURACIÓN DE SUPABASE
        ====================================== */

        const SUPABASE_URL =
            "https://mulzhbuwkunaeurwexpr.supabase.co";

        /*
           Tu publishable key se mantiene intacta.
        */

        const SUPABASE_KEY =
            "sb_publishable_zuoRx_-W1HYMJDUQ1c49MQ_AUEsQhIr";

        const supabaseClient =
            window.supabase.createClient(
                SUPABASE_URL,
                SUPABASE_KEY
            );


        /* =====================================
           ELEMENTOS
        ====================================== */

        const loginScreen =
            document.getElementById(
                "login-screen"
            );

        const chatScreen =
            document.getElementById(
                "chat-screen"
            );

        const usernameInput =
            document.getElementById(
                "username"
            );

        const enterButton =
            document.getElementById(
                "enter-button"
            );

        const currentUser =
            document.getElementById(
                "current-user"
            );

        const messageForm =
            document.getElementById(
                "message-form"
            );

        const messageInput =
            document.getElementById(
                "message-input"
            );

        const messages =
            document.getElementById(
                "messages"
            );


        /* =====================================
           DATOS DEL CHAT
        ====================================== */

        let username = "";

        /*
           El chat se identifica mediante:

           ?chat=abc123

           Si no existe, usamos "general".
        */

        const params =
            new URLSearchParams(
                window.location.search
            );

        const chatId =
            params.get("chat") || "general";


        /* =====================================
           ENTRAR
        ====================================== */

        async function enterChat() {

            const name =
                usernameInput.value.trim();

            if (name === "") {
                usernameInput.focus();
                return;
            }

            username = name;

            currentUser.textContent =
                "👤 " + username;

            loginScreen.style.display =
                "none";

            chatScreen.style.display =
                "flex";

            await loadMessages();

            subscribeToMessages();

            messageInput.focus();
        }


        enterButton.addEventListener(
            "click",
            enterChat
        );


        usernameInput.addEventListener(
            "keydown",
            function(event) {

                if (event.key === "Enter") {
                    enterChat();
                }

            }
        );


        /* =====================================
           CARGAR MENSAJES
        ====================================== */

        async function loadMessages() {

            const {
                data,
                error
            } = await supabaseClient

                .from("messages")

                .select("*")

                .eq("chat_id", chatId)

                .order(
                    "created_at",
                    {
                        ascending: true
                    }
                );


            if (error) {

                console.error(
                    "Error cargando mensajes:",
                    error
                );

                return;
            }


            data.forEach(
                addMessageToScreen
            );


            scrollToBottom();
        }


        /* =====================================
           HORA CORRECTA

           Supabase normalmente entrega timestamps
           en UTC. Si la base devuelve un timestamp
           sin zona, lo tratamos como UTC para evitar
           que aparezca una hora incorrecta.
        ====================================== */

        function getMessageDate(timestamp) {

            if (!timestamp) {
                return new Date();
            }

            const value =
                String(timestamp).trim();

            /*
               Si NO tiene Z ni un offset (+00:00),
               asumimos que viene en UTC.
            */

            const hasTimezone =
                /(?:Z|[+-]\d{2}:?\d{2})$/i.test(value);

            const normalizedValue =
                hasTimezone
                    ? value
                    : value + "Z";

            const date =
                new Date(normalizedValue);

            /*
               Fallback por seguridad.
            */

            if (Number.isNaN(date.getTime())) {
                return new Date(timestamp);
            }

            return date;
        }


        function formatMessageTime(timestamp) {

            const date =
                getMessageDate(timestamp);

            return new Intl.DateTimeFormat(
                undefined,
                {
                    hour: "2-digit",
                    minute: "2-digit",
                    hour12: false
                }
            ).format(date);
        }


        /* =====================================
           MOSTRAR MENSAJE
        ====================================== */

        function addMessageToScreen(
            message
        ) {

            const element =
                document.createElement(
                    "div"
                );

            element.classList.add(
                "message"
            );

            /*
               Diferenciamos visualmente los
               mensajes enviados por el usuario.
            */

            if (
                message.username === username
            ) {
                element.classList.add("mine");
            }


            /* NOMBRE + ESTRELLAS */

            const nameWrap =
                document.createElement(
                    "div"
                );

            nameWrap.classList.add(
                "name-wrap"
            );


            const starLeft =
                document.createElement(
                    "span"
                );

            starLeft.classList.add(
                "star"
            );

            starLeft.textContent = "✦";


            const starSmall =
                document.createElement(
                    "span"
                );

            starSmall.classList.add(
                "star",
                "small"
            );

            starSmall.textContent = "✧";


            const name =
                document.createElement(
                    "div"
                );

            name.classList.add(
                "name"
            );

            name.textContent =
                message.username;


            const starRight =
                document.createElement(
                    "span"
                );

            starRight.classList.add(
                "star"
            );

            starRight.textContent = "✦";


            nameWrap.appendChild(
                starLeft
            );

            nameWrap.appendChild(
                starSmall
            );

            nameWrap.appendChild(
                name
            );

            nameWrap.appendChild(
                starRight
            );


            /* TEXTO */

            const text =
                document.createElement(
                    "div"
                );

            text.classList.add(
                "text"
            );

            text.textContent =
                message.message;


            /* HORA */

            const time =
                document.createElement(
                    "span"
                );

            time.classList.add(
                "time"
            );

            time.textContent =
                formatMessageTime(
                    message.created_at
                );


            element.appendChild(
                nameWrap
            );

            element.appendChild(
                text
            );

            element.appendChild(
                time
            );


            messages.appendChild(
                element
            );


            scrollToBottom();
        }


        /* =====================================
           ENVIAR MENSAJE
        ====================================== */

        messageForm.addEventListener(
            "submit",
            async function(event) {

                event.preventDefault();

                const text =
                    messageInput.value.trim();

                if (text === "") {
                    return;
                }


                const {
                    error
                } = await supabaseClient

                    .from("messages")

                    .insert({
                        chat_id: chatId,
                        username: username,
                        message: text
                    });


                if (error) {

                    console.error(
                        "Error enviando mensaje:",
                        error
                    );

                    alert(
                        "No se pudo enviar el mensaje."
                    );

                    return;
                }


                messageInput.value = "";

                messageInput.focus();
            }
        );


        /* =====================================
           TIEMPO REAL
        ====================================== */

        function subscribeToMessages() {

            supabaseClient

                .channel(
                    "chat-" + chatId
                )

                .on(
                    "postgres_changes",
                    {
                        event: "INSERT",
                        schema: "public",
                        table: "messages",
                        filter:
                            "chat_id=eq." + chatId
                    },

                    function(payload) {

                        addMessageToScreen(
                            payload.new
                        );

                    }
                )

                .subscribe();
        }


        /* =====================================
           SCROLL
        ====================================== */

        function scrollToBottom() {

            messages.scrollTop =
                messages.scrollHeight;
        }

    </script>

</body>

</html>
