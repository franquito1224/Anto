        function setAudioStatus(
            text,
            active = false
        ) {

            audioStatus.textContent =
                text;

            audioStatus.classList.toggle(
                "show",
                !!text
            );

            audioStatus.classList.toggle(
                "active",
                active
            );

            if (text) {

                clearTimeout(
                    setAudioStatus.hideTimer
                );

                setAudioStatus.hideTimer =
                    setTimeout(

                                audioStatus.classList.remove(
                                    "show"
                                );

                            }

                        },
                        3500
                    );
            }
        }


        /* =====================================
           ENTRAR AL CHAT
        ====================================== */

        async function enterChat() {

            const name =
                usernameInput.value.trim();

            if (!name) {

                usernameInput.focus();

                return;
            }


            username = name;


            await requestNotificationPermission();


            currentUser.textContent =
                "👤 " + username;


            loginScreen.style.display =
                "none";


            chatScreen.style.display =

            await loadMessages();

        /* =====================================

        ====================================== */

        async function loadMessages() {

            const {
                data,
                error
            } =
                await supabaseClient
                    .from("messages")
                    .select("*")
                    .eq("chat_id", chatId)
                    .order(
                        "created_at",

                        }
                    );

        /* =====================================
           HORA
        ====================================== */

        function getMessageDate(
            timestamp
        ) {

            if (!timestamp) {

                return new Date();

            }


            const value =
                String(timestamp).trim();


            const hasTimezone =
                /(?:Z|[+-]\d{2}:?\d{2})$/i
                    .test(value);


            const normalizedValue =
                hasTimezone
                    ? value
                    : value + "Z";


            const date =
                new Date(
                    normalizedValue
                );


            if (
                Number.isNaN(
                    date.getTime()
                )
            ) {

                return new Date(timestamp);

            }


            return date;

        }


        function formatMessageTime(
            timestamp
        ) {

            const date =
                getMessageDate(timestamp);


            return new Intl.DateTimeFormat(
                undefined,
                {
                    hour: "2-digit",
                    minute: "2-digit",
                    hour12: false
                }
            ).format(date);

        }

        ) {

            /*
             * Evita duplicados.
             *
             * Cada mensaje tiene un ID de Supabase.
             */

            if (
                message.id &&
                messages.querySelector(
                    `[data-message-id="${message.id}"]`
                )
            ) {

                return;

            }


            const element =
                document.createElement("div");


            element.classList.add(
                "message"
            );


            if (message.id) {

                element.dataset.messageId =
                    message.id;

            }


            const isMine =
                message.username === username;


            if (isMine) {

                element.classList.add(
                    "mine"
                );

            }


            /* =========================
               NOMBRE
            ========================== */

            const nameWrap =
                document.createElement("div");


            nameWrap.classList.add(
                "name-wrap"
            );


            const starLeft =
                document.createElement("span");


            starLeft.classList.add(
                "star"
            );

            starLeft.textContent =
                "✦";


            const starSmall =
                document.createElement("span");


            starSmall.classList.add(
                "star",
                "small"
            );

            starSmall.textContent =
                "✧";


            const name =
                document.createElement("div");


            name.classList.add(
                "name"
            );

            name.textContent =
                message.username;


            const starRight =
                document.createElement("span");


            starRight.classList.add(
                "star"
            );

            starRight.textContent =
                "✦";


            nameWrap.appendChild(
                starLeft
            );

            nameWrap.appendChild(
                starSmall
            );

            nameWrap.appendChild(
                name
            );

            nameWrap.appendChild(
                starRight
            );


            element.appendChild(
                nameWrap
            );


            /* =========================
               RESPUESTA CITADA
            ========================== */

            if (message.reply_to_id) {

                const reply =
                    document.createElement("div");


                reply.classList.add(
                    "message-reply"
                );


                const replyAuthor =
                    document.createElement("strong");


                replyAuthor.textContent =
                    "↩ " +
                    (
                        message.reply_to_username ||
                        "Mensaje"
                    );


                const replyText =
                    document.createElement("span");


                replyText.textContent =
                    message.reply_to_message ||
                    "Mensaje";


                reply.appendChild(
                    replyAuthor
                );

                reply.appendChild(
                    replyText
                );


                element.appendChild(
                    reply
                );

            }


            /* =========================
               TEXTO
            ========================== */

            if (message.message) {

                const text =
                    document.createElement("div");


                text.classList.add(
                    "text"
                );


                text.textContent =
                    message.message;


                element.appendChild(
                    text
                );

            }


            /* =========================
               HORA
            ========================== */

            const time =
                document.createElement("span");


            time.classList.add(
                "time"
            );


            time.textContent =
                formatMessageTime(
                    message.created_at
                );


            element.appendChild(
                time
            );


            /* =========================
               RESPONDER
            ========================== */

            const tools =
                document.createElement("div");


            tools.classList.add(
                "message-tools"
            );


            const replyButton =
                document.createElement("button");


            replyButton.type =
                "button";


            replyButton.classList.add(
                "reply-button"
            );


            replyButton.textContent =
                "↩ Responder";


            replyButton.addEventListener(
                "click",
                () => {

                    startReply(
                        message
                    );

                }
            );


            tools.appendChild(
                replyButton
            );


            element.appendChild(
                tools
            );


            messages.appendChild(
                element
            );


            /* =========================
               NOTIFICACIÓN
            ========================== */

            if (
                fromRealtime &&
                message.username !== username
            ) {

                notifyIncomingMessage(
                    message
                );

            }


            scrollToBottom();

        }


        /* =====================================
           RESPONDER
        ====================================== */

        function startReply(
            message
        ) {

            replyTarget = {

                id:
                    String(message.id),

                username:
                    message.username,

                message:
                    message.message || ""

            };


            replyName.textContent =
                message.username;


            replyPreview.textContent =
                replyTarget.message ||
                "Mensaje";


            replyBox.classList.add(
                "show"
            );


            messageInput.focus();

        }


        function clearReply() {

            replyTarget =
                null;


            replyBox.classList.remove(
                "show"
            );


            replyName.textContent =
                "";


            replyPreview.textContent =
                "";

        }


        cancelReply.addEventListener(
            "click",
            clearReply
        );


        /* =====================================
           NOTIFICACIONES
        ====================================== */

        async function requestNotificationPermission() {

            if (
                !("Notification" in window)
            ) {

                return;

            }


            if (
                Notification.permission ===
                "default"
            ) {

                try {

                    await Notification.requestPermission();

                } catch (error) {

                    console.warn(
                        "No se pudo solicitar permiso:",
                        error
                    );

                }

            }

        }


        function showNotificationStatus(
            text
        ) {

            notificationStatus.textContent =
                text;


            notificationStatus.classList.add(
                "show"
            );


            clearTimeout(
                showNotificationStatus.timer
            );


            showNotificationStatus.timer =
                setTimeout(
                    () => {

                        notificationStatus.classList.remove(
                            "show"
                        );

                    },
                    3000
                );

        }


        function notifyIncomingMessage(
            message
        ) {

            flashDocumentTitle();


            if (
                !("Notification" in window)
            ) {

                return;

            }


            if (
                Notification.permission !==
                "granted"
            ) {

                return;

            }


            /*
             * Solo aparece notificación si
             * el usuario está en otra pestaña.
             */

            if (!document.hidden) {

                return;

            }


            let body =
                message.message ||
                "Nuevo mensaje";


            if (
                body.length > 100
            ) {

                body =
                    body.slice(0, 97) +
                    "...";

            }


            try {

                const notification =
                    new Notification(
                        "Mi otra mitad · " +
                        message.username,
                        {
                            body: body,
                            tag:
                                "chat-" +
                                chatId
                        }
                    );


                notification.onclick =
                    () => {

                        window.focus();

                        notification.close();

                    };


            } catch (error) {

                console.warn(
                    "No se pudo mostrar notificación:",
                    error
                );

            }

        }


        function flashDocumentTitle() {

            clearInterval(
                titleFlashTimer
            );


            let visible =
                false;

            let count =
                0;


            titleFlashTimer =
                setInterval(
                    () => {

                        visible =
                            !visible;

                        count++;


                        document.title =
                            visible
                                ? "💙 Nuevo mensaje"
                                : notificationTitle;


                        if (count >= 8) {

                            clearInterval(
                                titleFlashTimer
                            );


                            document.title =
                                notificationTitle;

                        }

                    },
                    700
                );

        }


        /* =====================================
           ENVIAR MENSAJE
        ====================================== */

        messageForm.addEventListener(
            "submit",
            async event => {

                event.preventDefault();


                const text =
                    messageInput.value.trim();


                if (!text) {

                    return;

                }


                /*
                 * Guardamos también la información
                 * necesaria para mostrar la respuesta.
                 */

                const messageData = {

                    chat_id:
                        chatId,

                    username:
                        username,

                    message:
                        text,

                    reply_to_id:
                        replyTarget
                            ? replyTarget.id
                            : null,

                    reply_to_username:
                        replyTarget
                            ? replyTarget.username
                            : null,

                    reply_to_message:
                        replyTarget
                            ? replyTarget.message
                            : null

                };


                const {
                    data,
                    error
                } =
                    await supabaseClient
                        .from("messages")
                        .insert(
                            messageData
                        )
                        .select()
                        .single();


                if (error) {

                    console.error(
                        "Error enviando mensaje:",
                        error
                    );


                    alert(
                        "No se pudo enviar el mensaje.\n\n" +
                        "Error: " +
                        error.message
                    );


                    return;

                }


                /*
                 * Limpiamos el formulario.
                 */

                messageInput.value =
                    "";


                clearReply();


                messageInput.focus();

            }
        );


        /* =====================================
           TIEMPO REAL
        ====================================== */

        function subscribeToMessages() {

            supabaseClient

                .channel(
                    "messages-" +
                    chatId
                )

                .on(
                    "postgres_changes",
                    {
                        event: "INSERT",
                        schema: "public",
                        table: "messages",

                        filter:
                            "chat_id=eq." +
                            chatId

                    },

                    payload => {

                        addMessageToScreen(
                            payload.new,
                            true
                        );

                    }

                )

                .subscribe(
                    status => {

                        console.log(
                            "Estado Realtime:",
                            status
                        );

                    }
                );

        }


        /* =====================================
           AUDIO WEBRTC
        ====================================== */

        async function setupAudioChannel() {

            audioChannel =
                supabaseClient.channel(
                    "audio-" +
                    chatId,
                    {
                        config: {
                            presence: {
                                key:
                                    crypto.randomUUID()
                            }
                        }
                    }
                );


            audioChannel

                .on(
                    "presence",
                    {
                        event: "sync"
                    },
                    handlePresenceSync
                )

                .on(
                    "presence",
                    {
                        event: "join"
                    },
                    handlePresenceJoin
                )

                .on(
                    "broadcast",
                    {
                        event: "webrtc"
                    },
                    async ({
                        payload
                    }) => {

                        if (!payload) {
                            return;
                        }


                        await handleWebRTCSignal(
                            payload
                        );

                    }
                );


            await audioChannel.subscribe(
                async status => {

                    if (
                        status ===
                        "SUBSCRIBED"
                    ) {

                        await audioChannel.track(
                            {
                                username:
                                    username,

                                joinedAt:
                                    Date.now()
                            }
                        );


                        setAudioStatus(
                            "Audio listo · micrófono apagado"
                        );

                    }

                }
            );

        }


        function getPresenceCount() {

            if (!audioChannel) {

                return 0;

            }


            const state =
                audioChannel.presenceState();


            return Object.keys(state).length;

        }


        async function handlePresenceSync() {

            remotePeerPresent =
                getPresenceCount() > 1;


            if (
                remotePeerPresent &&
                audioStarted
            ) {

                await ensurePeerConnection();


                if (!makingOffer) {

                    await createOffer();

                }

            }

        }


        async function handlePresenceJoin() {

            remotePeerPresent =
                true;


            if (audioStarted) {

                await ensurePeerConnection();


                if (!makingOffer) {

                    await createOffer();

                }

            }

        }


        /* =====================================
           PEER CONNECTION
        ====================================== */

        async function ensurePeerConnection() {

            if (peerConnection) {

                return peerConnection;

            }


            peerConnection =
                new RTCPeerConnection(
                    rtcConfig
                );


            peerConnection.onicecandidate =
                async event => {

                    if (!event.candidate) {

                        return;

                    }


                    await sendSignal({

                        type:
                            "candidate",

                        candidate:
                            event.candidate

                    });

                };


            peerConnection.ontrack =
                async event => {

                    if (
                        event.streams &&
                        event.streams[0]
                    ) {

                        remoteAudio.srcObject =
                            event.streams[0];

                    } else {

                        remoteAudio.srcObject =
                            new MediaStream([
                                event.track
                            ]);

                    }


                    try {

                        await remoteAudio.play();

                    } catch (error) {

                        console.warn(
                            "El navegador bloqueó el audio:",
                            error
                        );

                    }


                    setAudioStatus(
                        "🔊 Audio conectado",
                        true
                    );

                };


            peerConnection.onconnectionstatechange =
                () => {

                    if (!peerConnection) {

                        return;

                    }


                    const state =
                        peerConnection.connectionState;


                    if (
                        state ===
                        "connected"
                    ) {

                        setAudioStatus(
                            audioStarted
                                ? "🎙️ Micrófono activo · 🔊 audio conectado"
                                : "🔊 Audio conectado · micrófono apagado",
                            audioStarted
                        );

                    }


                    if (
                        state === "failed" ||
                        state === "disconnected"
                    ) {

                        setAudioStatus(
                            "Reconectando audio..."
                        );

                    }

                };


            /*
             * Agregamos el micrófono si ya existe.
             */

            if (localStream) {

                localStream
                    .getTracks()
                    .forEach(
                        track => {

                            peerConnection.addTrack(
                                track,
                                localStream
                            );

                        }
                    );

            }


            return peerConnection;

        }


        /* =====================================
           MICRÓFONO
        ====================================== */

        async function getLocalMicrophone() {

            if (localStream) {

                return localStream;

            }


            try {

                localStream =
                    await navigator
                        .mediaDevices
                        .getUserMedia({

                            audio: {

                                echoCancellation:
                                    true,

                                noiseSuppression:
                                    true,

                                autoGainControl:
                                    true

                            },

                            video:
                                false

                        });


                localAudioTrack =
                    localStream
                        .getAudioTracks()[0];


                localAudioTrack.enabled =
                    false;


                return localStream;

            } catch (error) {

                console.error(
                    "Error micrófono:",
                    error
                );


                if (
                    error.name ===
                    "NotAllowedError"
                ) {

                    alert(
                        "Necesitas permitir el micrófono en el navegador."
                    );

                } else {

                    alert(
                        "No se pudo acceder al micrófono."
                    );

                }


                return null;

            }

        }


        /* =====================================
           BOTÓN DE LLAMADA
        ====================================== */

        micButton.addEventListener(
            "click",
            async () => {

                if (!audioChannel) {

                    setAudioStatus(
                        "El audio todavía está conectando..."
                    );

                    return;

                }


                /*
                 * Primera vez:
                 * solicitar permiso.
                 */

                if (!localStream) {

                    micButton.classList.add(
                        "waiting"
                    );


                    const stream =
                        await getLocalMicrophone();


                    micButton.classList.remove(
                        "waiting"
                    );


                    if (!stream) {

                        return;

                    }


                    await ensurePeerConnection();

                }


                if (!localAudioTrack) {

                    return;

                }


                localAudioTrack.enabled =
                    !localAudioTrack.enabled;


                audioStarted =
                    localAudioTrack.enabled;


                if (audioStarted) {

                    micButton.classList.add(
                        "active"
                    );


                    micButton.textContent =
                        "🎙️";


                    micButton.title =
                        "Apagar micrófono";


                    micButton.setAttribute(
                        "aria-label",
                        "Apagar micrófono"
                    );


                    setAudioStatus(
                        remotePeerPresent
                            ? "🎙️ Micrófono activo · 🔊 conectado"
                            : "🎙️ Micrófono activo · esperando a la otra persona",
                        true
                    );


                    if (remotePeerPresent) {

                        await ensurePeerConnection();


                        if (!makingOffer) {

                            await createOffer();

                        }

                    }

                } else {

                    micButton.classList.remove(
                        "active"
                    );


                    micButton.textContent =
                        "📞";


                    micButton.title =
                        "Activar micrófono";


                    micButton.setAttribute(
                        "aria-label",
                        "Activar micrófono"
                    );


                    setAudioStatus(
                        "🔇 Micrófono apagado"
                    );

                }

            }
        );


        /* =====================================
           CREAR OFFER
        ====================================== */

        async function createOffer() {

            if (
                !peerConnection ||
                !remotePeerPresent ||
                makingOffer
            ) {

                return;

            }


            try {

                makingOffer =
                    true;


                const offer =
                    await peerConnection
                        .createOffer();


                await peerConnection
                    .setLocalDescription(
                        offer
                    );


                await sendSignal({

                    type:
                        "offer",

                    description:
                        peerConnection.localDescription

                });

            } catch (error) {

                console.error(
                    "Error creando offer:",
                    error
                );

            } finally {

                makingOffer =
                    false;

            }

        }


        /* =====================================
           ENVIAR SEÑAL
        ====================================== */

        async function sendSignal(
            data
        ) {

            if (!audioChannel) {

                return;

            }


            try {

                await audioChannel.send({

                    type:
                        "broadcast",

                    event:
                        "webrtc",

                    payload:
                        data

                });

            } catch (error) {

                console.error(
                    "Error señal WebRTC:",
                    error
                );

            }

        }


        /* =====================================
           RECIBIR SEÑAL
        ====================================== */

        async function handleWebRTCSignal(
            payload
        ) {

            if (
                !payload ||
                !audioChannel
            ) {

                return;

            }


            try {

                /* OFFER */

                if (
                    payload.type ===
                    "offer"
                ) {

                    await ensurePeerConnection();


                    await peerConnection
                        .setRemoteDescription(
                            new RTCSessionDescription(
                                payload.description
                            )
                        );


                    const answer =
                        await peerConnection
                            .createAnswer();


                    await peerConnection
                        .setLocalDescription(
                            answer
                        );


                    await sendSignal({

                        type:
                            "answer",

                        description:
                            peerConnection.localDescription

                    });

                }


                /* ANSWER */

                else if (
                    payload.type ===
                    "answer"
                ) {

                    if (!peerConnection) {

                        return;

                    }


                    await peerConnection
                        .setRemoteDescription(
                            new RTCSessionDescription(
                                payload.description
                            )
                        );

                }


                /* ICE */

                else if (
                    payload.type ===
                    "candidate"
                ) {

                    if (
                        !peerConnection ||
                        !payload.candidate
                    ) {

                        return;

                    }


                    try {

                        await peerConnection
                            .addIceCandidate(
                                new RTCIceCandidate(
                                    payload.candidate
                                )
                            );

                    } catch (error) {

                        console.warn(
                            "Error ICE:",
                            error
                        );

                    }

                }

            } catch (error) {

                console.error(
                    "Error WebRTC:",
                    error
                );

            }

        }


        /* =====================================
           LIMPIEZA
        ====================================== */

        window.addEventListener(
            "beforeunload",
            () => {

                if (localStream) {

                    localStream
                        .getTracks()
                        .forEach(
                            track =>
                                track.stop()
                        );

                }


                if (peerConnection) {

                    peerConnection.close();

                }


                if (audioChannel) {

                    audioChannel.unsubscribe();

                }

            }
        );


        window.addEventListener(
            "focus",
            () => {

                clearInterval(
                    titleFlashTimer
                );


                document.title =
                    notificationTitle;

            }
        );


        /* =====================================
           SCROLL
        ====================================== */

        function scrollToBottom() {

            messages.scrollTop =
                messages.scrollHeight;

        }

    </script>

</body>

</html>
