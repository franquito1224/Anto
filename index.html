<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mi otra mitad 🌙</title>

    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --night: #061329;
            --night-2: #091a35;
            --night-3: #0d2345;
            --blue: #3d8eea;
            --blue-light: #8ed8ff;
            --bubble: #9bdcff;
            --bubble-2: #75c9f5;
            --text-dark: #08203d;
            --white-blue: #eaf8ff;
            --call-green: #42d392;
            --call-red: #ff647c;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: var(--night);
            color: white;
            height: 100vh;
            overflow: hidden;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            background:
                radial-gradient(circle at 15% 20%, rgba(74, 154, 255, .12), transparent 25%),
                radial-gradient(circle at 85% 75%, rgba(57, 202, 255, .10), transparent 28%),
                linear-gradient(145deg, #061329, #0a1c3b 50%, #041024);
            z-index: -2;
        }

        body::after {
            content: "✦     ·   ✧        ·       ⋆   ·          ✦\A"
                   "   ·        ✦       ·    ⋆       ✧       ·\A"
                   "✧       ·      ⋆         ·       ✦      ·\A"
                   "     ⋆       ·       ✧       ·       ⋆";
            white-space: pre;
            position: fixed;
            inset: 0;
            pointer-events: none;
            color: rgba(190, 231, 255, .42);
            font-size: 13px;
            line-height: 7;
            letter-spacing: 18px;
            padding: 10px 3%;
            opacity: .55;
            z-index: -1;
        }

        /* =========================
           PANTALLA DE ENTRADA
        ========================== */

        #login-screen {
            position: fixed;
            inset: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background:
                radial-gradient(circle at 50% 0%, rgba(64, 145, 235, .22), transparent 38%),
                linear-gradient(145deg, #061329, #091c3b 55%, #041024);
        }

        .login-box {
            width: min(90%, 420px);
            padding: 38px 34px;
            background: rgba(9, 27, 55, .92);
            border: 1px solid rgba(142, 216, 255, .22);
            border-radius: 24px;
            text-align: center;
            box-shadow:
                0 25px 80px rgba(0, 0, 0, .45),
                0 0 45px rgba(61, 142, 234, .10);
            backdrop-filter: blur(12px);
        }

        .login-icon {
            font-size: 42px;
            margin-bottom: 10px;
            filter: drop-shadow(0 0 12px rgba(142, 216, 255, .35));
        }

        .login-box h1 {
            font-size: 30px;
            margin-bottom: 10px;
        }

        .login-box p {
            color: #a9c8e5;
            margin-bottom: 25px;
            line-height: 1.5;
        }

        #username {
            width: 100%;
            padding: 14px 16px;
            background: #06162d;
            color: white;
            border: 1px solid #245282;
            border-radius: 13px;
            outline: none;
            font-size: 16px;
            margin-bottom: 15px;
            transition: .2s;
        }

        #username:focus {
            border-color: var(--blue-light);
            box-shadow: 0 0 0 3px rgba(142, 216, 255, .10);
        }

        #enter-button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 13px;
            background: linear-gradient(135deg, #3d8eea, #58b7f4);
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: .2s;
            box-shadow: 0 8px 22px rgba(61, 142, 234, .25);
        }

        #enter-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 28px rgba(61, 142, 234, .35);
        }

        /* =========================
           CHAT
        ========================== */

        #chat-screen {
            display: none;
            height: 100vh;
            width: 100%;
            flex-direction: column;
        }

        .chat-header {
            min-height: 70px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            background: rgba(5, 19, 42, .94);
            border-bottom: 1px solid rgba(142, 216, 255, .15);
            box-shadow: 0 5px 25px rgba(0, 0, 0, .18);
            backdrop-filter: blur(12px);
        }

        .chat-title {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .chat-icon {
            width: 42px;
            height: 42px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(145deg, #164f8d, #237bc2);
            border: 1px solid rgba(142, 216, 255, .25);
            border-radius: 50%;
            box-shadow: 0 0 20px rgba(61, 142, 234, .20);
        }

        .chat-title h2 {
            font-size: 18px;
        }

        .online {
            font-size: 12px;
            color: #8fc3e9;
        }

        .online::before {
            content: "●";
            color: #69d7ff;
            margin-right: 5px;
            text-shadow: 0 0 8px #69d7ff;
        }

        #current-user {
            color: #cceaff;
            font-size: 14px;
        }

        /* =========================
           CONTROLES DE AUDIO
        ========================== */

        .header-actions {
            display: flex;
            align-items: center;
            gap: 9px;
        }

        #mic-button {
            width: 46px;
            height: 46px;
            border: 1px solid rgba(142, 216, 255, .22);
            border-radius: 50%;
            background: rgba(19, 52, 91, .85);
            color: white;
            font-size: 21px;
            cursor: pointer;
            transition: .2s;
            box-shadow: 0 5px 18px rgba(0, 0, 0, .18);
        }

        #mic-button:hover {
            transform: scale(1.06);
            border-color: rgba(142, 216, 255, .55);
        }

        #mic-button.active {
            background: linear-gradient(145deg, #36b978, #42d392);
            border-color: rgba(190, 255, 224, .65);
            box-shadow: 0 0 22px rgba(66, 211, 146, .30);
        }

        #mic-button.waiting {
            animation: pulseMic 1.5s infinite;
        }

        #audio-status {
            position: fixed;
            right: 18px;
            top: 80px;
            z-index: 20;
            display: none;
            max-width: calc(100vw - 36px);
            padding: 8px 12px;
            border-radius: 12px;
            background: rgba(7, 25, 52, .92);
            border: 1px solid rgba(142, 216, 255, .16);
            color: #a9c8e5;
            font-size: 11px;
            backdrop-filter: blur(10px);
        }

        #audio-status.show {
            display: block;
        }

        #audio-status.active {
            color: #9df0c7;
            border-color: rgba(66, 211, 146, .25);
        }

        #remote-audio {
            display: none;
        }

        @keyframes pulseMic {
            0%, 100% {
                box-shadow: 0 0 0 0 rgba(66, 211, 146, .35);
            }
            50% {
                box-shadow: 0 0 0 9px rgba(66, 211, 146, 0);
            }
        }

        /* =========================
           MENSAJES
        ========================== */

        #messages {
            flex: 1;
            overflow-y: auto;
            padding: 24px 20px;
            display: flex;
            flex-direction: column;
            gap: 13px;
            background:
                radial-gradient(circle at 20% 15%, rgba(55, 130, 210, .08), transparent 25%),
                radial-gradient(circle at 80% 80%, rgba(75, 178, 240, .07), transparent 28%),
                #06152d;
            scroll-behavior: smooth;
        }

        #messages::-webkit-scrollbar {
            width: 8px;
        }

        #messages::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, .03);
        }

        #messages::-webkit-scrollbar-thumb {
            background: #174779;
            border-radius: 10px;
        }

        .message {
            max-width: 75%;
            padding: 11px 15px;
            border-radius: 17px 17px 17px 5px;
            background: linear-gradient(145deg, var(--bubble), #83d0f7);
            color: var(--text-dark);
            align-self: flex-start;
            border: 1px solid rgba(215, 246, 255, .55);
            box-shadow:
                0 7px 20px rgba(0, 0, 0, .18),
                0 0 18px rgba(117, 201, 245, .08);
            animation: messageIn .2s ease-out;
        }

        .message.mine {
            align-self: flex-end;
            border-radius: 17px 17px 5px 17px;
            background: linear-gradient(145deg, #b3e6ff, #83d1fa);
        }

        .name-wrap {
            display: flex;
            align-items: center;
            gap: 7px;
            margin-bottom: 4px;
            min-height: 18px;
        }

        .star {
            color: #fff8bd;
            font-size: 11px;
            text-shadow: 0 0 6px rgba(255, 248, 189, .9);
            line-height: 1;
        }

        .star.small {
            font-size: 8px;
            opacity: .8;
        }

        .message .name {
            font-size: 12px;
            font-weight: bold;
            color: #17466e;
        }

        .message .text {
            font-size: 15px;
            line-height: 1.45;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .message .time {
            display: block;
            text-align: right;
            font-size: 10px;
            color: #326080;
            margin-top: 6px;
        }

        .system-message {
            align-self: center;
            max-width: 90%;
            text-align: center;
            background: rgba(20, 54, 91, .45);
            color: #86b9dc;
            border: 1px solid rgba(134, 185, 220, .10);
            padding: 9px 14px;
            border-radius: 14px;
            box-shadow: none;
        }

        .system-message .name {
            color: #9fd5f3;
        }

        /* =========================
           CAJA DE MENSAJE
        ========================== */

        .message-area {
            display: flex;
            gap: 10px;
            padding: 13px 15px;
            background: rgba(7, 25, 52, .97);
            border-top: 1px solid rgba(142, 216, 255, .15);
            box-shadow: 0 -7px 25px rgba(0, 0, 0, .16);
        }

        #message-input {
            flex: 1;
            padding: 13px 16px;
            background: #2f72b8;
            color: white;
            border: 1px solid #5599d5;
            border-radius: 13px;
            outline: none;
            font-size: 15px;
            box-shadow: inset 0 2px 8px rgba(0, 0, 0, .12);
            transition: .2s;
        }

        #message-input::placeholder {
            color: rgba(235, 249, 255, .72);
        }

        #message-input:focus {
            background: #357ec6;
            border-color: #8ed8ff;
            box-shadow:
                0 0 0 3px rgba(142, 216, 255, .10),
                inset 0 2px 8px rgba(0, 0, 0, .12);
        }

        #send-button {
            width: 52px;
            border: none;
            border-radius: 13px;
            background: linear-gradient(145deg, #55b8f0, #3285d0);
            color: white;
            font-size: 21px;
            cursor: pointer;
            transition: .2s;
            box-shadow: 0 7px 18px rgba(50, 133, 208, .25);
        }

        #send-button:hover {
            transform: scale(1.05) rotate(-2deg);
            box-shadow: 0 10px 23px rgba(50, 133, 208, .35);
        }

        @keyframes messageIn {
            from {
                opacity: 0;
                transform: translateY(5px) scale(.98);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }


        /* =========================
           IMÁGENES Y RESPUESTAS
        ========================== */

        .message-image {
            display: block;
            width: min(280px, 100%);
            max-height: 360px;
            object-fit: cover;
            border-radius: 13px;
            margin-top: 7px;
            cursor: pointer;
            border: 1px solid rgba(255,255,255,.35);
            box-shadow: 0 5px 18px rgba(0,0,0,.18);
        }

        .reply-box {
            display: none;
            align-items: center;
            gap: 10px;
            padding: 8px 12px;
            background: rgba(13, 35, 69, .96);
            border-top: 1px solid rgba(142,216,255,.12);
        }

        .reply-box.show {
            display: flex;
        }

        .reply-line {
            flex: 1;
            min-width: 0;
            border-left: 3px solid var(--blue-light);
            padding-left: 9px;
        }

        .reply-label {
            font-size: 11px;
            color: #8ed8ff;
            margin-bottom: 2px;
        }

        .reply-preview {
            color: #cceaff;
            font-size: 12px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        #cancel-reply {
            border: none;
            background: transparent;
            color: #9fc5e4;
            font-size: 20px;
            cursor: pointer;
            padding: 4px 7px;
        }

        .message-reply {
            margin-bottom: 8px;
            padding: 7px 9px;
            border-left: 3px solid #3d8eea;
            background: rgba(8, 32, 61, .10);
            border-radius: 7px;
            font-size: 11px;
        }

        .message-reply strong {
            display: block;
            color: #17466e;
            margin-bottom: 2px;
        }

        .message-reply span {
            display: block;
            color: #326080;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .message-tools {
            display: flex;
            justify-content: flex-end;
            margin-top: 5px;
        }

        .reply-button {
            border: none;
            background: transparent;
            color: #326080;
            font-size: 11px;
            cursor: pointer;
            padding: 2px 4px;
        }

        .reply-button:hover {
            color: #17466e;
            text-decoration: underline;
        }

        #image-button {
            width: 48px;
            border: none;
            border-radius: 13px;
            background: linear-gradient(145deg, #245f9b, #317dbb);
            color: white;
            font-size: 20px;
            cursor: pointer;
            transition: .2s;
        }

        #image-button:hover {
            transform: scale(1.04);
        }

        #image-input {
            display: none;
        }

        #upload-status {
            position: fixed;
            left: 50%;
            bottom: 83px;
            transform: translateX(-50%);
            display: none;
            z-index: 30;
            padding: 8px 13px;
            border-radius: 12px;
            background: rgba(7,25,52,.95);
            border: 1px solid rgba(142,216,255,.18);
            color: #bfe7ff;
            font-size: 12px;
            box-shadow: 0 8px 25px rgba(0,0,0,.25);
        }

        #upload-status.show {
            display: block;
        }

        /* =========================
           MÓVIL
        ========================== */

        @media (max-width: 600px) {
            .login-box {
                padding: 30px 22px;
            }

            .chat-header {
                padding: 0 12px;
            }

            #messages {
                padding: 15px 12px;
            }

            .message {
                max-width: 85%;
            }

            #current-user {
                display: none;
            }

            .message-area {
                padding: 10px;
            }

            #message-input {
                min-width: 0;
            }

            #audio-status {
                top: 75px;
                right: 10px;
            }
        }
    </style>
</head>

<body>

    <!-- =========================
         ENTRADA
    ========================== -->

    <section id="login-screen">

        <div class="login-box">

            <div class="login-icon">🌙</div>

            <h1>Mi otra mitad</h1>

            <p>
                Elige el nombre que aparecerá
                junto a tus mensajes bajo este cielo nocturno ✦
            </p>

            <input
                type="text"
                id="username"
                maxlength="20"
                placeholder="Tu nombre..."
                autocomplete="off"
            >

            <button id="enter-button">
                Entrar ✦
            </button>

        </div>

    </section>


    <!-- =========================
         CHAT
    ========================== -->

    <main id="chat-screen">

        <header class="chat-header">

            <div class="chat-title">

                <div class="chat-icon">
                    💬
                </div>

                <div>

                    <h2>
                        Mi otra mitad
                    </h2>

                    <span class="online">
                        Siempre aquí
                    </span>

                </div>

            </div>

            <div class="header-actions">

                <div id="current-user"></div>

                <!-- Micrófono: la conexión de audio permanece disponible,
                     pero el micrófono empieza apagado. -->
                <button
                    id="mic-button"
                    type="button"
                    aria-label="Activar micrófono"
                    title="Activar micrófono"
                >📞</button>

            </div>

        </header>

        <div id="audio-status"></div>

        <!-- Elemento de audio remoto -->
        <audio id="remote-audio" autoplay playsinline></audio>


        <!-- MENSAJES -->

        <section id="messages">

            <div class="message system-message">

                <div class="name-wrap">
                    <span class="star">✦</span>
                    <div class="name">💬 Sistema</div>
                    <span class="star">✦</span>
                </div>

                <div class="text">
                    Bienvenido a tu pequeño rincón bajo las estrellas 👋
                </div>

            </div>

        </section>


        <!-- RESPONDER -->

        <div class="reply-box" id="reply-box">
            <div class="reply-line">
                <div class="reply-label">Respondiendo a <strong id="reply-name"></strong></div>
                <div class="reply-preview" id="reply-preview"></div>
            </div>
            <button type="button" id="cancel-reply" aria-label="Cancelar respuesta">×</button>
        </div>

        <!-- ESCRIBIR -->

        <form
            class="message-area"
            id="message-form"
        >

            <button
                type="button"
                id="image-button"
                aria-label="Enviar imagen"
                title="Enviar imagen"
            >🖼️</button>

            <input
                type="file"
                id="image-input"
                accept="image/*"
            >

            <input
                type="text"
                id="message-input"
                placeholder="Escribe un mensaje bajo las estrellas..."
                autocomplete="off"
            >

            <button
                type="submit"
                id="send-button"
                aria-label="Enviar mensaje"
            >
                ➤
            </button>

        </form>

        <div id="upload-status"></div>

    </main>


    <!-- =========================
         JAVASCRIPT
    ========================== -->

    <script>

        /* =====================================
           CONFIGURACIÓN DE SUPABASE
        ====================================== */

        const SUPABASE_URL =
            "https://mulzhbuwkunaeurwexpr.supabase.co";

        const SUPABASE_KEY =
            "sb_publishable_zuoRx_-W1HYMJDUQ1c49MQ_AUEsQhIr";

        const supabaseClient =
            window.supabase.createClient(
                SUPABASE_URL,
                SUPABASE_KEY
            );


        /* =====================================
           ELEMENTOS
        ====================================== */

        const loginScreen =
            document.getElementById("login-screen");

        const chatScreen =
            document.getElementById("chat-screen");

        const usernameInput =
            document.getElementById("username");

        const enterButton =
            document.getElementById("enter-button");

        const currentUser =
            document.getElementById("current-user");

        const messageForm =
            document.getElementById("message-form");

        const messageInput =
            document.getElementById("message-input");

        const messages =
            document.getElementById("messages");

        const micButton =
            document.getElementById("mic-button");

        const audioStatus =
            document.getElementById("audio-status");

        const remoteAudio =
            document.getElementById("remote-audio");

        const imageButton =
            document.getElementById("image-button");

        const imageInput =
            document.getElementById("image-input");

        const replyBox =
            document.getElementById("reply-box");

        const replyName =
            document.getElementById("reply-name");

        const replyPreview =
            document.getElementById("reply-preview");

        const cancelReply =
            document.getElementById("cancel-reply");

        const uploadStatus =
            document.getElementById("upload-status");

        let replyTarget = null;
        let notificationTitle = document.title;
        let titleFlashTimer = null;


        /* =====================================
           DATOS DEL CHAT
        ====================================== */

        let username = "";

        const params =
            new URLSearchParams(
                window.location.search
            );

        const chatId =
            params.get("chat") || "general";


        /* =====================================
           AUDIO WEBRTC
           Una conexión de audio por chat.

           Supabase Realtime se utiliza para
           intercambiar la señalización.
        ====================================== */

        let audioChannel = null;
        let peerConnection = null;
        let localStream = null;
        let localAudioTrack = null;

        let audioStarted = false;
        let remotePeerPresent = false;
        let makingOffer = false;
        let ignoreOffer = false;

        const rtcConfig = {
            iceServers: [
                { urls: "stun:stun.l.google.com:19302" },
                { urls: "stun:stun.cloudflare.com:3478" }
            ]
        };


        function setAudioStatus(text, active = false) {
            audioStatus.textContent = text;
            audioStatus.classList.toggle("show", !!text);
            audioStatus.classList.toggle("active", active);

            if (text) {
                clearTimeout(setAudioStatus.hideTimer);

                setAudioStatus.hideTimer = setTimeout(() => {
                    if (!audioStarted) {
                        audioStatus.classList.remove("show");
                    }
                }, 3500);
            }
        }


        /* =====================================
           ENTRAR
        ====================================== */

        async function enterChat() {

            const name =
                usernameInput.value.trim();

            if (name === "") {
                usernameInput.focus();
                return;
            }

            username = name;

            await requestNotificationPermission();

            currentUser.textContent =
                "👤 " + username;

            loginScreen.style.display =
                "none";

            chatScreen.style.display =
                "flex";

            await loadMessages();

            subscribeToMessages();

            setupAudioChannel();

            messageInput.focus();
        }


        enterButton.addEventListener(
            "click",
            enterChat
        );


        usernameInput.addEventListener(
            "keydown",
            function(event) {

                if (event.key === "Enter") {
                    enterChat();
                }

            }
        );


        /* =====================================
           CARGAR MENSAJES
        ====================================== */

        async function loadMessages() {

            const {
                data,
                error
            } = await supabaseClient
                .from("messages")
                .select("*")
                .eq("chat_id", chatId)
                .order(
                    "created_at",
                    {
                        ascending: true
                    }
                );


            if (error) {

                console.error(
                    "Error cargando mensajes:",
                    error
                );

                return;
            }


            data.forEach(
                addMessageToScreen
            );


            scrollToBottom();
        }


        /* =====================================
           HORA CORRECTA
        ====================================== */

        function getMessageDate(timestamp) {

            if (!timestamp) {
                return new Date();
            }

            const value =
                String(timestamp).trim();

            const hasTimezone =
                /(?:Z|[+-]\d{2}:?\d{2})$/i.test(value);

            const normalizedValue =
                hasTimezone
                    ? value
                    : value + "Z";

            const date =
                new Date(normalizedValue);

            if (Number.isNaN(date.getTime())) {
                return new Date(timestamp);
            }

            return date;
        }


        function formatMessageTime(timestamp) {

            const date =
                getMessageDate(timestamp);

            return new Intl.DateTimeFormat(
                undefined,
                {
                    hour: "2-digit",
                    minute: "2-digit",
                    hour12: false
                }
            ).format(date);
        }


        /* =====================================
           MOSTRAR MENSAJE
        ====================================== */

        function addMessageToScreen(
            message
        ) {

            const element =
                document.createElement("div");

            element.classList.add("message");

            const isMine =
                message.username === username;

            if (isMine) {
                element.classList.add("mine");
            }

            /* NOMBRE + ESTRELLAS */

            const nameWrap =
                document.createElement("div");

            nameWrap.classList.add("name-wrap");

            const starLeft =
                document.createElement("span");

            starLeft.classList.add("star");
            starLeft.textContent = "✦";

            const starSmall =
                document.createElement("span");

            starSmall.classList.add("star", "small");
            starSmall.textContent = "✧";

            const name =
                document.createElement("div");

            name.classList.add("name");
            name.textContent = message.username;

            const starRight =
                document.createElement("span");

            starRight.classList.add("star");
            starRight.textContent = "✦";

            nameWrap.appendChild(starLeft);
            nameWrap.appendChild(starSmall);
            nameWrap.appendChild(name);
            nameWrap.appendChild(starRight);

            element.appendChild(nameWrap);

            /* RESPUESTA CITADA */

            if (message.reply_to_id) {

                const reply =
                    document.createElement("div");

                reply.classList.add("message-reply");

                const replyAuthor =
                    document.createElement("strong");

                replyAuthor.textContent =
                    "↩ " + (
                        message.reply_to_username ||
                        "Mensaje"
                    );

                const replyText =
                    document.createElement("span");

                replyText.textContent =
                    message.reply_to_message ||
                    "Imagen";

                reply.appendChild(replyAuthor);
                reply.appendChild(replyText);

                element.appendChild(reply);
            }

            /* TEXTO */

            if (message.message) {

                const text =
                    document.createElement("div");

                text.classList.add("text");
                text.textContent = message.message;

                element.appendChild(text);
            }

            /* IMAGEN */

            if (message.image_url) {

                const image =
                    document.createElement("img");

                image.classList.add("message-image");
                image.src = message.image_url;
                image.alt = "Imagen enviada por " + message.username;
                image.loading = "lazy";

                image.addEventListener(
                    "click",
                    () => {
                        window.open(
                            message.image_url,
                            "_blank",
                            "noopener,noreferrer"
                        );
                    }
                );

                element.appendChild(image);
            }

            /* HORA */

            const time =
                document.createElement("span");

            time.classList.add("time");

            time.textContent =
                formatMessageTime(
                    message.created_at
                );

            element.appendChild(time);

            /* RESPONDER */

            const tools =
                document.createElement("div");

            tools.classList.add("message-tools");

            const replyButton =
                document.createElement("button");

            replyButton.type = "button";
            replyButton.classList.add("reply-button");
            replyButton.textContent = "↩ Responder";

            replyButton.addEventListener(
                "click",
                () => startReply(message)
            );

            tools.appendChild(replyButton);
            element.appendChild(tools);

            messages.appendChild(element);

            /*
             * Solo notificamos mensajes que llegan de otra persona.
             * El mensaje propio también llega por Realtime, pero no
             * debe producir una notificación.
             */
            if (
                message.username !== username &&
                message._fromRealtime
            ) {
                notifyIncomingMessage(message);
            }

            scrollToBottom();
        }


        /* =====================================
           RESPUESTAS
        ====================================== */

        function startReply(message) {

            replyTarget = {
                id: String(message.id),
                username: message.username,
                message:
                    message.message ||
                    (message.image_url ? "🖼️ Imagen" : "")
            };

            replyName.textContent =
                message.username;

            replyPreview.textContent =
                replyTarget.message;

            replyBox.classList.add("show");

            messageInput.focus();
        }


        function clearReply() {

            replyTarget = null;

            replyBox.classList.remove("show");

            replyName.textContent = "";
            replyPreview.textContent = "";
        }


        cancelReply.addEventListener(
            "click",
            clearReply
        );


        /* =====================================
           NOTIFICACIONES DEL NAVEGADOR
        ====================================== */

        async function requestNotificationPermission() {

            if (
                !("Notification" in window)
            ) {
                return;
            }

            if (
                Notification.permission === "default"
            ) {

                try {
                    await Notification.requestPermission();
                } catch (error) {
                    console.warn(
                        "No se pudo solicitar permiso para notificaciones:",
                        error
                    );
                }
            }
        }


        function notifyIncomingMessage(message) {

            flashDocumentTitle();

            if (
                !("Notification" in window) ||
                Notification.permission !== "granted"
            ) {
                return;
            }

            /*
             * Si el chat está visible, evitamos una notificación
             * molesta. Si está en otra pestaña/minimizado, avisamos.
             */
            if (!document.hidden) {
                return;
            }

            let body =
                message.message ||
                "🖼️ Te enviaron una imagen";

            if (body.length > 100) {
                body =
                    body.slice(0, 97) + "...";
            }

            try {

                const notification =
                    new Notification(
                        "Mi otra mitad · " +
                        message.username,
                        {
                            body: body,
                            icon: "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🌙%3C/text%3E%3C/svg%3E",
                            tag: "chat-" + chatId
                        }
                    );

                notification.onclick =
                    () => {
                        window.focus();
                        notification.close();
                    };

            } catch (error) {

                console.warn(
                    "No se pudo mostrar la notificación:",
                    error
                );
            }
        }


        function flashDocumentTitle() {

            clearInterval(titleFlashTimer);

            let visible = false;
            let count = 0;

            titleFlashTimer =
                setInterval(() => {

                    visible = !visible;
                    count++;

                    document.title =
                        visible
                            ? "💙 Nuevo mensaje"
                            : notificationTitle;

                    if (count >= 8) {

                        clearInterval(
                            titleFlashTimer
                        );

                        document.title =
                            notificationTitle;
                    }

                }, 700);
        }


        /* =====================================
           SUBIR IMÁGENES
        ====================================== */

        function setUploadStatus(
            text
        ) {

            uploadStatus.textContent =
                text;

            uploadStatus.classList.add(
                "show"
            );
        }


        function hideUploadStatus() {

            uploadStatus.classList.remove(
                "show"
            );
        }


        imageButton.addEventListener(
            "click",
            () => imageInput.click()
        );


        imageInput.addEventListener(
            "change",
            async () => {

                const file =
                    imageInput.files[0];

                if (!file) {
                    return;
                }

                /*
                 * Límite razonable para una página
                 * de chat sencilla.
                 */
                const maxSize =
                    8 * 1024 * 1024;

                if (file.size > maxSize) {

                    alert(
                        "La imagen es demasiado grande. El máximo es 8 MB."
                    );

                    imageInput.value = "";
                    return;
                }

                if (
                    !file.type.startsWith("image/")
                ) {

                    alert(
                        "Solo puedes enviar imágenes."
                    );

                    imageInput.value = "";
                    return;
                }


                try {

                    setUploadStatus(
                        "🖼️ Subiendo imagen..."
                    );


                    const safeName =
                        file.name
                            .replace(
                                /[^a-zA-Z0-9._-]/g,
                                "_"
                            );

                    const filePath =
                        chatId +
                        "/" +
                        Date.now() +
                        "-" +
                        crypto.randomUUID() +
                        "-" +
                        safeName;


                    const {
                        error: uploadError
                    } = await supabaseClient
                        .storage
                        .from("chat-media")
                        .upload(
                            filePath,
                            file,
                            {
                                cacheControl: "3600",
                                upsert: false,
                                contentType: file.type
                            }
                        );


                    if (uploadError) {

                        console.error(
                            "Error subiendo imagen:",
                            uploadError
                        );

                        throw uploadError;
                    }


                    const {
                        data: publicData
                    } =
                        supabaseClient
                            .storage
                            .from("chat-media")
                            .getPublicUrl(
                                filePath
                            );


                    const imageUrl =
                        publicData.publicUrl;


                    const {
                        error: messageError
                    } =
                        await supabaseClient
                            .from("messages")
                            .insert({
                                chat_id: chatId,
                                username: username,
                                message: "",
                                image_url: imageUrl,
                                reply_to_id:
                                    replyTarget
                                        ? replyTarget.id
                                        : null,
                                reply_to_username:
                                    replyTarget
                                        ? replyTarget.username
                                        : null,
                                reply_to_message:
                                    replyTarget
                                        ? replyTarget.message
                                        : null
                            });


                    if (messageError) {

                        console.error(
                            "Error creando mensaje de imagen:",
                            messageError
                        );

                        throw messageError;
                    }


                    clearReply();

                    setUploadStatus(
                        "✓ Imagen enviada"
                    );

                    setTimeout(
                        hideUploadStatus,
                        1800
                    );

                } catch (error) {

                    console.error(
                        "Error enviando imagen:",
                        error
                    );

                    setUploadStatus(
                        "No se pudo enviar la imagen."
                    );

                    setTimeout(
                        hideUploadStatus,
                        3000
                    );

                } finally {

                    imageInput.value = "";
                }
            }
        );


        /* =====================================
           ENVIAR MENSAJE
        ====================================== */

        messageForm.addEventListener(
            "submit",
            async function(event) {

                event.preventDefault();

                const text =
                    messageInput.value.trim();

                if (text === "") {
                    return;
                }


                const {
                    error
                } = await supabaseClient
                    .from("messages")
                    .insert({
                        chat_id: chatId,
                        username: username,
                        message: text,
                        image_url: null,
                        reply_to_id:
                            replyTarget
                                ? replyTarget.id
                                : null,
                        reply_to_username:
                            replyTarget
                                ? replyTarget.username
                                : null,
                        reply_to_message:
                            replyTarget
                                ? replyTarget.message
                                : null
                    });


                if (error) {

                    console.error(
                        "Error enviando mensaje:",
                        error
                    );

                    alert(
                        "No se pudo enviar el mensaje. Si acabas de activar respuestas/imágenes, revisa la configuración de Supabase."
                    );

                    return;
                }


                messageInput.value = "";

                clearReply();

                messageInput.focus();
            }
        );


        /* =====================================
           TIEMPO REAL - MENSAJES
        ====================================== */

        function subscribeToMessages() {

            supabaseClient
                .channel(
                    "chat-" + chatId
                )
                .on(
                    "postgres_changes",
                    {
                        event: "INSERT",
                        schema: "public",
                        table: "messages",
                        filter:
                            "chat_id=eq." + chatId
                    },
                    function(payload) {

                        const incoming =
                            {
                                ...payload.new,
                                _fromRealtime: true
                            };

                        addMessageToScreen(
                            incoming
                        );

                    }
                )
                .subscribe();
        }


        /* =====================================
           WEBRTC - CANAL DE SEÑALIZACIÓN

           No se guarda audio en Supabase.
           Supabase Realtime solamente pasa:
             - presencia
             - offer
             - answer
             - ICE candidates

           El audio va directamente entre
           los navegadores mediante WebRTC.
        ====================================== */

        async function setupAudioChannel() {

            audioChannel =
                supabaseClient.channel(
                    "audio-" + chatId,
                    {
                        config: {
                            presence: {
                                key: crypto.randomUUID()
                            }
                        }
                    }
                );


            audioChannel
                .on(
                    "presence",
                    {
                        event: "sync"
                    },
                    handlePresenceSync
                )
                .on(
                    "presence",
                    {
                        event: "join"
                    },
                    handlePresenceJoin
                )
                .on(
                    "broadcast",
                    {
                        event: "webrtc"
                    },
                    async ({ payload }) => {

                        if (!payload) return;

                        await handleWebRTCSignal(payload);
                    }
                );


            const status =
                await audioChannel.subscribe(
                    async (status) => {

                        if (status === "SUBSCRIBED") {

                            await audioChannel.track({
                                username: username,
                                joinedAt: Date.now()
                            });

                            setAudioStatus(
                                "Audio listo · micrófono apagado"
                            );
                        }
                    }
                );


            if (status !== "SUBSCRIBED") {
                console.warn(
                    "No se pudo conectar el canal de audio:",
                    status
                );
            }
        }


        function getPresenceCount() {

            if (!audioChannel) return 0;

            const state =
                audioChannel.presenceState();

            return Object.keys(state).length;
        }


        async function handlePresenceSync() {

            const count =
                getPresenceCount();

            remotePeerPresent =
                count > 1;

            if (
                remotePeerPresent &&
                audioStarted
            ) {
                await ensurePeerConnection();

                if (!makingOffer) {
                    await createOffer();
                }
            }
        }


        async function handlePresenceJoin() {

            remotePeerPresent = true;

            /*
             * Si ya tenemos el micrófono activo,
             * intentamos iniciar la conexión.
             */
            if (audioStarted) {

                await ensurePeerConnection();

                if (!makingOffer) {
                    await createOffer();
                }
            }
        }


        /* =====================================
           CREAR CONEXIÓN PEER
        ====================================== */

        async function ensurePeerConnection() {

            if (peerConnection) {
                return peerConnection;
            }


            peerConnection =
                new RTCPeerConnection(
                    rtcConfig
                );


            peerConnection.onicecandidate =
                async (event) => {

                    if (!event.candidate) {
                        return;
                    }

                    await sendSignal({
                        type: "candidate",
                        candidate: event.candidate
                    });
                };


            peerConnection.ontrack =
                async (event) => {

                    if (
                        event.streams &&
                        event.streams[0]
                    ) {

                        remoteAudio.srcObject =
                            event.streams[0];

                    } else {

                        const stream =
                            new MediaStream([
                                event.track
                            ]);

                        remoteAudio.srcObject =
                            stream;
                    }


                    try {
                        await remoteAudio.play();
                    } catch (error) {
                        console.warn(
                            "El navegador bloqueó el audio automático:",
                            error
                        );
                    }

                    setAudioStatus(
                        "🔊 Audio de la otra persona conectado",
                        true
                    );
                };


            peerConnection.onconnectionstatechange =
                () => {

                    const state =
                        peerConnection.connectionState;

                    if (state === "connected") {

                        setAudioStatus(
                            audioStarted
                                ? "🎤 Micrófono activo · 🔊 audio conectado"
                                : "🔊 Audio conectado · micrófono apagado",
                            audioStarted
                        );

                    } else if (
                        state === "disconnected" ||
                        state === "failed"
                    ) {

                        setAudioStatus(
                            "Reconectando audio..."
                        );
                    }
                };


            peerConnection.onnegotiationneeded =
                async () => {

                    if (
                        !audioStarted ||
                        makingOffer
                    ) {
                        return;
                    }

                    try {
                        await createOffer();
                    } catch (error) {
                        console.error(
                            "Error creando oferta:",
                            error
                        );
                    }
                };


            /*
             * IMPORTANTE:
             * El track local siempre puede existir,
             * pero empieza muted/desactivado.
             */
            if (localStream) {

                localStream
                    .getTracks()
                    .forEach(track => {

                        peerConnection.addTrack(
                            track,
                            localStream
                        );

                    });

            }


            return peerConnection;
        }


        /* =====================================
           OBTENER MICRÓFONO

           Solo se pide permiso cuando el usuario
           pulsa el botón.
        ====================================== */

        async function getLocalMicrophone() {

            if (localStream) {
                return localStream;
            }


            try {

                localStream =
                    await navigator.mediaDevices
                        .getUserMedia({
                            audio: {
                                echoCancellation: true,
                                noiseSuppression: true,
                                autoGainControl: true
                            },
                            video: false
                        });


                localAudioTrack =
                    localStream.getAudioTracks()[0];

                /*
                 * Empieza apagado aunque el navegador
                 * haya concedido permiso.
                 */
                localAudioTrack.enabled =
                    false;


                return localStream;

            } catch (error) {

                console.error(
                    "No se pudo acceder al micrófono:",
                    error
                );

                if (
                    error.name === "NotAllowedError"
                ) {

                    alert(
                        "Necesitas permitir el uso del micrófono en el navegador para activar el audio."
                    );

                } else {

                    alert(
                        "No se pudo acceder al micrófono."
                    );
                }

                return null;
            }
        }


        /* =====================================
           ACTIVAR / DESACTIVAR MICRÓFONO
        ====================================== */

        micButton.addEventListener(
            "click",
            async function() {

                if (!audioChannel) {
                    setAudioStatus(
                        "El audio todavía está conectando..."
                    );
                    return;
                }


                /*
                 * Primera pulsación:
                 * pide permiso al navegador.
                 */
                if (!localStream) {

                    micButton.classList.add(
                        "waiting"
                    );

                    const stream =
                        await getLocalMicrophone();

                    micButton.classList.remove(
                        "waiting"
                    );

                    if (!stream) {
                        return;
                    }


                    await ensurePeerConnection();

                    /*
                     * Aseguramos que el track empiece
                     * apagado hasta terminar la preparación.
                     */
                    if (localAudioTrack) {
                        localAudioTrack.enabled =
                            false;
                    }
                }


                if (!localAudioTrack) {
                    return;
                }


                localAudioTrack.enabled =
                    !localAudioTrack.enabled;


                audioStarted =
                    localAudioTrack.enabled;


                if (audioStarted) {

                    micButton.classList.add("active");

                    micButton.textContent = "🎙️";

                    micButton.setAttribute(
                        "aria-label",
                        "Apagar micrófono"
                    );

                    micButton.title =
                        "Apagar micrófono";


                    setAudioStatus(
                        remotePeerPresent
                            ? "🎙️ Micrófono activo · 🔊 audio conectado"
                            : "🎙️ Micrófono activo · esperando a la otra persona",
                        true
                    );


                    /*
                     * Si la otra persona ya está en el chat,
                     * comenzamos la negociación.
                     */
                    if (remotePeerPresent) {

                        await ensurePeerConnection();

                        if (!makingOffer) {
                            await createOffer();
                        }

                    }

                } else {

                    micButton.classList.remove("active");

                    micButton.textContent = "📞";

                    micButton.setAttribute(
                        "aria-label",
                        "Activar micrófono"
                    );

                    micButton.title =
                        "Activar micrófono";


                    setAudioStatus(
                        "🔇 Micrófono apagado · audio listo"
                    );
                }
            }
        );


        /* =====================================
           CREAR OFFER
        ====================================== */

        async function createOffer() {

            if (!peerConnection) {
                return;
            }

            if (!remotePeerPresent) {
                return;
            }


            if (makingOffer) {
                return;
            }


            try {

                makingOffer = true;

                const offer =
                    await peerConnection.createOffer();

                await peerConnection.setLocalDescription(
                    offer
                );

                await sendSignal({
                    type: "offer",
                    description:
                        peerConnection.localDescription
                });

            } catch (error) {

                console.error(
                    "Error creando offer:",
                    error
                );

            } finally {

                makingOffer = false;
            }
        }


        /* =====================================
           ENVIAR SEÑAL WEBRTC
        ====================================== */

        async function sendSignal(data) {

            if (!audioChannel) {
                return;
            }

            try {

                await audioChannel.send({
                    type: "broadcast",
                    event: "webrtc",
                    payload: {
                        ...data
                    }
                });

            } catch (error) {

                console.error(
                    "Error enviando señal WebRTC:",
                    error
                );
            }
        }


        /* =====================================
           RECIBIR SEÑAL WEBRTC
        ====================================== */

        async function handleWebRTCSignal(payload) {

            if (!payload || !audioChannel) {
                return;
            }


            /*
             * No necesitamos identificarnos por nombre:
             * Realtime broadcast entrega el evento a
             * los otros clientes del canal, no al emisor.
             */

            try {

                if (
                    payload.type === "offer"
                ) {

                    /*
                     * La persona que recibe una offer
                     * prepara su conexión.
                     */
                    await ensurePeerConnection();


                    await peerConnection.setRemoteDescription(
                        new RTCSessionDescription(
                            payload.description
                        )
                    );


                    const answer =
                        await peerConnection.createAnswer();


                    await peerConnection.setLocalDescription(
                        answer
                    );


                    await sendSignal({
                        type: "answer",
                        description:
                            peerConnection.localDescription
                    });


                    if (
                        audioStarted &&
                        localAudioTrack
                    ) {
                        localAudioTrack.enabled =
                            true;
                    }


                } else if (
                    payload.type === "answer"
                ) {

                    if (!peerConnection) {
                        return;
                    }


                    await peerConnection.setRemoteDescription(
                        new RTCSessionDescription(
                            payload.description
                        )
                    );


                } else if (
                    payload.type === "candidate"
                ) {

                    if (!peerConnection) {
                        return;
                    }


                    if (
                        payload.candidate
                    ) {

                        try {

                            await peerConnection.addIceCandidate(
                                new RTCIceCandidate(
                                    payload.candidate
                                )
                            );

                        } catch (error) {

                            /*
                             * Algunos candidatos pueden llegar
                             * antes de la descripción remota.
                             */
                            console.warn(
                                "No se pudo añadir ICE candidate:",
                                error
                            );
                        }
                    }
                }

            } catch (error) {

                console.error(
                    "Error procesando señal WebRTC:",
                    error
                );
            }
        }


        /* =====================================
           LIMPIEZA AL SALIR
        ====================================== */

        window.addEventListener(
            "beforeunload",
            () => {

                if (localStream) {

                    localStream
                        .getTracks()
                        .forEach(track => {
                            track.stop();
                        });
                }


                if (peerConnection) {
                    peerConnection.close();
                }


                if (audioChannel) {
                    audioChannel.unsubscribe();
                }
            }
        );


        window.addEventListener(
            "focus",
            () => {
                clearInterval(titleFlashTimer);
                document.title = notificationTitle;
            }
        );


        /* =====================================
           SCROLL
        ====================================== */

        function scrollToBottom() {

            messages.scrollTop =
                messages.scrollHeight;
        }

    </script>

</body>
</html>
