<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mi otra mitad 🌙</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

:root{
    --night:#061329;
    --night-2:#091a35;
    --night-3:#0d2345;
    --blue:#3d8eea;
    --blue-light:#8ed8ff;
    --bubble:#9bdcff;
    --bubble-2:#75c9f5;
    --text-dark:#08203d;
    --call-green:#42d392;
    --danger:#ff6b81;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:var(--night);
    color:white;
    height:100vh;
    overflow:hidden;
}

body::before{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    background:
        radial-gradient(circle at 15% 20%,rgba(74,154,255,.12),transparent 25%),
        radial-gradient(circle at 85% 75%,rgba(57,202,255,.10),transparent 28%),
        linear-gradient(145deg,#061329,#0a1c3b 50%,#041024);
    z-index:-2;
}

body::after{
    content:
        "✦     ·   ✧        ·       ⋆   ·          ✦\A"
        "   ·        ✦       ·    ⋆       ✧       ·\A"
        "✧       ·      ⋆         ·       ✦      ·\A"
        "     ⋆       ·       ✧       ·       ⋆";

    white-space:pre;
    position:fixed;
    inset:0;
    pointer-events:none;
    color:rgba(190,231,255,.42);
    font-size:13px;
    line-height:7;
    letter-spacing:18px;
    padding:10px 3%;
    opacity:.55;
    z-index:-1;
}

/* LOGIN */

#login-screen{
    position:fixed;
    inset:0;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
    background:
        radial-gradient(circle at 50% 0%,rgba(64,145,235,.22),transparent 38%),
        linear-gradient(145deg,#061329,#091c3b 55%,#041024);
}

.login-box{
    width:min(90%,420px);
    padding:38px 34px;
    background:rgba(9,27,55,.92);
    border:1px solid rgba(142,216,255,.22);
    border-radius:24px;
    text-align:center;
    box-shadow:
        0 25px 80px rgba(0,0,0,.45),
        0 0 45px rgba(61,142,234,.10);
    backdrop-filter:blur(12px);
}

.login-icon{
    font-size:42px;
    margin-bottom:10px;
    filter:drop-shadow(0 0 12px rgba(142,216,255,.35));
}

.login-box h1{
    font-size:30px;
    margin-bottom:10px;
}

.login-box p{
    color:#a9c8e5;
    margin-bottom:25px;
    line-height:1.5;
}

#username{
    width:100%;
    padding:14px 16px;
    background:#06162d;
    color:white;
    border:1px solid #245282;
    border-radius:13px;
    outline:none;
    font-size:16px;
    margin-bottom:15px;
}

#username:focus{
    border-color:var(--blue-light);
    box-shadow:0 0 0 3px rgba(142,216,255,.10);
}

#enter-button{
    width:100%;
    padding:14px;
    border:none;
    border-radius:13px;
    background:linear-gradient(135deg,#3d8eea,#58b7f4);
    color:white;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
    transition:.2s;
}

#enter-button:hover{
    transform:translateY(-2px);
}

/* CHAT */

#chat-screen{
    display:none;
    height:100vh;
    width:100%;
    flex-direction:column;
}

.chat-header{
    min-height:70px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 20px;
    background:rgba(5,19,42,.94);
    border-bottom:1px solid rgba(142,216,255,.15);
    box-shadow:0 5px 25px rgba(0,0,0,.18);
    backdrop-filter:blur(12px);
}

.chat-title{
    display:flex;
    align-items:center;
    gap:12px;
}

.chat-icon{
    width:42px;
    height:42px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:linear-gradient(145deg,#164f8d,#237bc2);
    border:1px solid rgba(142,216,255,.25);
    border-radius:50%;
}

.chat-title h2{
    font-size:18px;
}

.online{
    font-size:12px;
    color:#8fc3e9;
}

.online::before{
    content:"●";
    color:#69d7ff;
    margin-right:5px;
    text-shadow:0 0 8px #69d7ff;
}

#current-user{
    color:#cceaff;
    font-size:14px;
}

.header-actions{
    display:flex;
    align-items:center;
    gap:9px;
}

#mic-button,
#camera-button,
#clear-chat-button{
    width:46px;
    height:46px;
    border:1px solid rgba(142,216,255,.22);
    border-radius:50%;
    background:rgba(19,52,91,.85);
    color:white;
    font-size:20px;
    cursor:pointer;
    transition:.2s;
}

#mic-button:hover,
#camera-button:hover,
#clear-chat-button:hover{
    transform:scale(1.06);
}

#clear-chat-button{
    color:#ff9aaa;
    border-color:rgba(255,107,129,.20);
}

#clear-chat-button:hover{
    background:rgba(130,35,57,.75);
}

#mic-button.active{
    background:linear-gradient(145deg,#36b978,#42d392);
    border-color:rgba(190,255,224,.65);
    box-shadow:0 0 22px rgba(66,211,146,.30);
}

#mic-button.waiting{
    animation:pulseMic 1.5s infinite;
}

@keyframes pulseMic{
    0%,100%{
        box-shadow:0 0 0 0 rgba(66,211,146,.35);
    }
    50%{
        box-shadow:0 0 0 9px rgba(66,211,146,0);
    }
}

#video-panel{
    position:fixed;
    right:18px;
    top:132px;
    z-index:19;
    display:none;
    gap:10px;
    flex-direction:column;
    width:min(260px,calc(100vw - 36px));
}
#video-panel.show{display:flex;}
.video-card{
    position:relative;
    overflow:hidden;
    aspect-ratio:16/10;
    border-radius:16px;
    background:#020a18;
    border:1px solid rgba(142,216,255,.20);
    box-shadow:0 12px 35px rgba(0,0,0,.35);
}
.video-card video{
    display:block;
    width:100%;
    height:100%;
    object-fit:cover;
    background:#020a18;
}
.video-card span{
    position:absolute;
    left:9px;
    bottom:8px;
    padding:4px 8px;
    border-radius:8px;
    background:rgba(3,14,30,.72);
    color:#d7efff;
    font-size:10px;
    backdrop-filter:blur(6px);
}
.remote-video-card{display:none;}
.remote-video-card.visible{display:block;}
#camera-button.active{
    background:linear-gradient(145deg,#3d8eea,#58b7f4);
    border-color:rgba(190,231,255,.75);
    box-shadow:0 0 22px rgba(88,183,244,.32);
}
#camera-button.waiting{animation:pulseCamera 1.5s infinite;}
@keyframes pulseCamera{
    0%,100%{box-shadow:0 0 0 0 rgba(88,183,244,.35);}
    50%{box-shadow:0 0 0 9px rgba(88,183,244,0);}
}
@media(max-width:600px){
    #video-panel{top:122px;right:10px;width:180px;}
}

#audio-status{
    position:fixed;
    right:18px;
    top:80px;
    z-index:20;
    display:none;
    max-width:calc(100vw - 36px);
    padding:8px 12px;
    border-radius:12px;
    background:rgba(7,25,52,.92);
    border:1px solid rgba(142,216,255,.16);
    color:#a9c8e5;
    font-size:11px;
}

#audio-status.show{
    display:block;
}

#audio-status.active{
    color:#9df0c7;
    border-color:rgba(66,211,146,.25);
}

#remote-audio{
    display:none;
}

/* MENSAJES */

#messages{
    flex:1;
    overflow-y:auto;
    padding:24px 20px;
    display:flex;
    flex-direction:column;
    gap:13px;
    background:
        radial-gradient(circle at 20% 15%,rgba(55,130,210,.08),transparent 25%),
        radial-gradient(circle at 80% 80%,rgba(75,178,240,.07),transparent 28%),
        #06152d;
    scroll-behavior:smooth;
}

#messages::-webkit-scrollbar{
    width:8px;
}

#messages::-webkit-scrollbar-track{
    background:rgba(255,255,255,.03);
}

#messages::-webkit-scrollbar-thumb{
    background:#174779;
    border-radius:10px;
}

.message{
    max-width:75%;
    padding:11px 15px;
    border-radius:17px 17px 17px 5px;
    background:linear-gradient(145deg,var(--bubble),#83d0f7);
    color:var(--text-dark);
    align-self:flex-start;
    border:1px solid rgba(215,246,255,.55);
    box-shadow:
        0 7px 20px rgba(0,0,0,.18),
        0 0 18px rgba(117,201,245,.08);
    animation:messageIn .2s ease-out;
}

.message.mine{
    align-self:flex-end;
    border-radius:17px 17px 5px 17px;
    background:linear-gradient(145deg,#b3e6ff,#83d1fa);
}

.name-wrap{
    display:flex;
    align-items:center;
    gap:7px;
    margin-bottom:4px;
    min-height:18px;
}

.star{
    color:#fff8bd;
    font-size:11px;
    text-shadow:0 0 6px rgba(255,248,189,.9);
}

.star.small{
    font-size:8px;
    opacity:.8;
}

.message .name{
    font-size:12px;
    font-weight:bold;
    color:#17466e;
}

.message .text{
    font-size:15px;
    line-height:1.45;
    white-space:pre-wrap;
    word-break:break-word;
}

.message .time{
    display:block;
    text-align:right;
    font-size:10px;
    color:#326080;
    margin-top:6px;
}

/* IMAGENES */

.message-image{
    display:block;
    width:100%;
    max-width:330px;
    max-height:420px;
    object-fit:cover;
    margin-top:8px;
    border-radius:12px;
    border:1px solid rgba(255,255,255,.35);
    cursor:pointer;
    box-shadow:0 5px 15px rgba(0,0,0,.18);
    transition:.2s;
}

.message-image:hover{
    transform:scale(1.015);
}

.image-loading{
    margin-top:8px;
    padding:12px;
    text-align:center;
    border-radius:10px;
    background:rgba(8,32,61,.12);
    font-size:12px;
}

/* SISTEMA */

.system-message{
    align-self:center;
    max-width:90%;
    text-align:center;
    background:rgba(20,54,91,.45);
    color:#86b9dc;
    border:1px solid rgba(134,185,220,.10);
    padding:9px 14px;
    border-radius:14px;
    box-shadow:none;
}

.system-message .name{
    color:#9fd5f3;
}

/* RESPUESTAS */

.reply-box{
    display:none;
    align-items:center;
    gap:10px;
    padding:8px 12px;
    background:rgba(13,35,69,.96);
    border-top:1px solid rgba(142,216,255,.12);
}

.reply-box.show{
    display:flex;
}

.reply-line{
    flex:1;
    min-width:0;
    border-left:3px solid var(--blue-light);
    padding-left:9px;
}

.reply-label{
    font-size:11px;
    color:#8ed8ff;
    margin-bottom:2px;
}

.reply-label strong{
    color:#bde9ff;
}

.reply-preview{
    color:#cceaff;
    font-size:12px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

#cancel-reply{
    border:none;
    background:transparent;
    color:#9fc5e4;
    font-size:20px;
    cursor:pointer;
    padding:4px 7px;
}

.message-reply{
    margin-bottom:8px;
    padding:7px 9px;
    border-left:3px solid #3d8eea;
    background:rgba(8,32,61,.10);
    border-radius:7px;
    font-size:11px;
}

.message-reply strong{
    display:block;
    color:#17466e;
    margin-bottom:2px;
}

.message-reply span{
    display:block;
    color:#326080;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

/* HERRAMIENTAS */

.message-tools{
    display:flex;
    justify-content:flex-end;
    gap:8px;
    margin-top:6px;
}

.reply-button,
.delete-button{
    border:none;
    background:transparent;
    font-size:11px;
    cursor:pointer;
    padding:3px 5px;
    border-radius:6px;
}

.reply-button{
    color:#326080;
}

.reply-button:hover{
    color:#17466e;
    background:rgba(23,70,110,.08);
}

.delete-button{
    color:#bd5267;
}

.delete-button:hover{
    color:#9e3048;
    background:rgba(189,82,103,.10);
}

/* DESVANECIMIENTO ESTELAR */
.message.is-fading{
    position:relative;
    overflow:hidden;
    pointer-events:none;
    animation:starDust 1.15s ease forwards;
}

.message.is-fading::before,
.message.is-fading::after{
    content:"✦  ·  ✧  ⋆  ·  ✦  ·  ✧  ⋆  ✦  ·  ⋆  ✧";
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    color:rgba(210,241,255,.95);
    font-size:13px;
    letter-spacing:7px;
    white-space:nowrap;
    pointer-events:none;
    opacity:0;
    filter:blur(.2px);
}

.message.is-fading::before{
    animation:dustBurst 1.05s ease forwards;
}

.message.is-fading::after{
    animation:dustBurst 1.05s .12s ease forwards reverse;
}

@keyframes starDust{
    0%{opacity:1; transform:scale(1); filter:blur(0);}
    45%{opacity:.8; transform:scale(1.015); filter:blur(.4px);}
    100%{opacity:0; transform:scale(.94); filter:blur(8px);}
}

@keyframes dustBurst{
    0%{opacity:0; transform:scale(.65) translateY(5px);}
    30%{opacity:1; transform:scale(1.05) translateY(0);}
    100%{opacity:0; transform:scale(1.55) translateY(-8px);}
}

.message.is-deleted{
    pointer-events:auto;
    max-width:75%;
    padding:12px 16px;
    background:rgba(95,137,177,.13)!important;
    border:1px solid rgba(174,220,248,.13)!important;
    box-shadow:0 7px 25px rgba(0,0,0,.15), inset 0 0 22px rgba(174,220,248,.035)!important;
    backdrop-filter:blur(9px);
    animation:deletedAppear .45s ease-out forwards;
}

.deleted-message{
    display:flex;
    align-items:center;
    gap:9px;
    color:#9ebbd2;
    font-size:12px;
    font-style:italic;
}

.deleted-message .deleted-icon{
    color:#c9ecff;
    font-size:15px;
    text-shadow:0 0 9px rgba(201,236,255,.65);
}

.deleted-message .deleted-time{
    margin-left:auto;
    font-size:10px;
    color:#6f91aa;
    font-style:normal;
}

@keyframes deletedAppear{
    from{opacity:0; transform:scale(.96); filter:blur(5px);}
    to{opacity:1; transform:scale(1); filter:blur(0);}
}

/* MENSAJE */

.message-area{
    display:flex;
    gap:8px;
    padding:13px 15px;
    background:rgba(7,25,52,.97);
    border-top:1px solid rgba(142,216,255,.15);
    box-shadow:0 -7px 25px rgba(0,0,0,.16);
}

#message-input{
    flex:1;
    min-width:0;
    padding:13px 16px;
    background:#2f72b8;
    color:white;
    border:1px solid #5599d5;
    border-radius:13px;
    outline:none;
    font-size:15px;
}

#message-input::placeholder{
    color:rgba(235,249,255,.72);
}

#message-input:focus{
    background:#357ec6;
    border-color:#8ed8ff;
    box-shadow:0 0 0 3px rgba(142,216,255,.10);
}

.extra-button{
    width:48px;
    flex-shrink:0;
    border:none;
    border-radius:13px;
    background:rgba(32,79,126,.95);
    color:white;
    font-size:19px;
    cursor:pointer;
    transition:.2s;
}

.extra-button:hover{
    transform:scale(1.05);
    background:rgba(48,105,164,1);
}

.extra-button.uploading{
    opacity:.65;
    cursor:wait;
}

#send-button{
    width:52px;
    flex-shrink:0;
    border:none;
    border-radius:13px;
    background:linear-gradient(145deg,#55b8f0,#3285d0);
    color:white;
    font-size:21px;
    cursor:pointer;
    transition:.2s;
}

#send-button:hover{
    transform:scale(1.05) rotate(-2deg);
}

#image-input{
    display:none;
}

/* NOTIFICACIONES */

#notification-status{
    position:fixed;
    left:50%;
    bottom:82px;
    transform:translateX(-50%);
    display:none;
    z-index:30;
    padding:8px 13px;
    border-radius:12px;
    background:rgba(7,25,52,.95);
    border:1px solid rgba(142,216,255,.18);
    color:#bfe7ff;
    font-size:12px;
    box-shadow:0 8px 25px rgba(0,0,0,.25);
}

#notification-status.show{
    display:block;
}

@media(max-width:600px){

    .login-box{
        padding:30px 22px;
    }

    .chat-header{
        padding:0 10px;
    }

    .chat-title{
        gap:8px;
    }

    .chat-icon{
        width:38px;
        height:38px;
    }

    .chat-title h2{
        font-size:15px;
    }

    .header-actions{
        gap:5px;
    }

    #mic-button,
    #camera-button,
    #clear-chat-button{
        width:40px;
        height:40px;
        font-size:17px;
    }

    #messages{
        padding:15px 12px;
    }

    .message{
        max-width:85%;
    }

    .message.is-deleted{
        max-width:85%;
    }

    #current-user{
        display:none;
    }

    .message-area{
        padding:10px;
        gap:6px;
    }

    #message-input{
        padding-left:12px;
        padding-right:12px;
    }

    .extra-button{
        width:44px;
    }

    #send-button{
        width:48px;
    }

    #audio-status{
        top:75px;
        right:10px;
    }
}

@keyframes messageIn{
    from{
        opacity:0;
        transform:translateY(5px) scale(.98);
    }
    to{
        opacity:1;
        transform:translateY(0) scale(1);
    }
}
</style>
</head>

<body>

<!-- LOGIN -->

<section id="login-screen">

    <div class="login-box">

        <div class="login-icon">🌙</div>

        <h1>Mi otra mitad</h1>

        <p>
            Elige el nombre que aparecerá junto a tus mensajes
            bajo este cielo nocturno ✦
        </p>

        <input
            type="text"
            id="username"
            maxlength="20"
            placeholder="Tu nombre..."
            autocomplete="off"
        >

        <button id="enter-button">
            Entrar ✦
        </button>

    </div>

</section>

<!-- CHAT -->

<main id="chat-screen">

<header class="chat-header">

    <div class="chat-title">

        <div class="chat-icon">💬</div>

        <div>
            <h2>Mi otra mitad</h2>
            <span class="online">Chat grupal · Siempre aquí</span>
        </div>

    </div>

    <div class="header-actions">

        <div id="current-user"></div>

        <button
            id="clear-chat-button"
            type="button"
            aria-label="Vaciar chat"
            title="Vaciar chat"
        >
            🧹
        </button>

        <button
            id="mic-button"
            type="button"
            aria-label="Activar micrófono"
            title="Activar micrófono"
        >
            📞
        </button>

        <button
            id="camera-button"
            type="button"
            aria-label="Activar cámara"
            title="Activar cámara"
        >
            📷
        </button>

    </div>

</header>

<div id="video-panel">
    <div class="video-card local-video-card">
        <video id="local-video" autoplay muted playsinline></video>
        <span>📷 Tú</span>
    </div>
    <div class="video-card remote-video-card">
        <video id="remote-video" autoplay playsinline></video>
        <span>📷 La otra persona</span>
    </div>
</div>

<div id="audio-status"></div>

<audio
    id="remote-audio"
    autoplay
    playsinline
></audio>

<section id="messages">

    <div class="message system-message">

        <div class="name-wrap">
            <span class="star">✦</span>
            <div class="name">💬 Sistema</div>
            <span class="star">✦</span>
        </div>

        <div class="text">
            Bienvenido a tu pequeño rincón bajo las estrellas 👋
        </div>

    </div>

</section>

<!-- RESPUESTA -->

<div class="reply-box" id="reply-box">

    <div class="reply-line">

        <div class="reply-label">
            Respondiendo a
            <strong id="reply-name"></strong>
        </div>

        <div
            class="reply-preview"
            id="reply-preview"
        ></div>

    </div>

    <button
        type="button"
        id="cancel-reply"
        aria-label="Cancelar respuesta"
        title="Cancelar respuesta"
    >
        ×
    </button>

</div>

<!-- MENSAJE -->

<form
    class="message-area"
    id="message-form"
>

    <input
        type="file"
        id="image-input"
        accept="image/*"
    >

    <button
        type="button"
        class="extra-button"
        id="image-button"
        title="Enviar imagen"
        aria-label="Enviar imagen"
    >
        🖼️
    </button>

    <input
        type="text"
        id="message-input"
        placeholder="Escribe un mensaje bajo las estrellas..."
        autocomplete="off"
    >

function parseStoredMessage(message){

    if(typeof message!=="string"){

        return{
            text:"",
            reply:null,
            image:null,
            deleted:false
        };

    }

    try{

        const parsed =
            JSON.parse(message);

        if(
            parsed &&
            parsed.__chat===true &&
            typeof parsed.message==="string"
        ){

            return{
                text:parsed.message,
                reply:parsed.reply||null,
                image:parsed.image||null,
                deleted:parsed.deleted===true
            };

        }

    }catch(error){}

    return{
        text:message,
        reply:null,
        image:null,
        deleted:false
    };
}

/* =====================================
   HORA CORRECTA
===================================== */

function getMessageDate(timestamp){

    if(!timestamp){
        return new Date();
    }

    const value =
        String(timestamp).trim();

    const hasTimezone =
        /(?:Z|[+-]\d{2}:?\d{2})$/i
            .test(value);

    const normalizedValue =
        hasTimezone
            ? value
            : value+"Z";

    const date =
        new Date(normalizedValue);

    if(Number.isNaN(date.getTime())){

        return new Date(timestamp);

    }

    return date;
}

function formatMessageTime(timestamp){

    const date =
        getMessageDate(timestamp);

    return new Intl.DateTimeFormat(
        undefined,
        {
            hour:"2-digit",
            minute:"2-digit",
            hour12:false
        }
    ).format(date);
}

async function deleteMessage(
    message,
    element
){

    if(
        !message.id ||
        String(message.id).startsWith("local-")
    ){
        return;
    }

    if(message.username!==username){
        showNotificationStatus(
            "Solo puedes desvanecer tus propios mensajes."
        );
        return;
    }

    if(element.classList.contains("is-fading") ||
       element.classList.contains("is-deleted")){
        return;
    }

    if(!confirm("¿Quieres hacer que este mensaje se desvanezca?")){
        return;
    }

    const parsed = parseStoredMessage(message.message);

    // Primero hacemos la animación local para que la acción se sienta inmediata.
    element.classList.add("is-fading");

    try{
        // Soft delete: no borramos la fila de Supabase.
        // La convertimos en un mensaje de "desvanecido" para que
        // también desaparezca visualmente en los demás dispositivos.
        const deletedPayload = {
            __chat:true,
            deleted:true,
            deletedBy:username,
            originalHasImage:!!parsed.image,
            message:"",
            reply:null,
            image:null
        };

        const {error} = await supabaseClient
            .from("messages")
            .update({
                message:JSON.stringify(deletedPayload)
            })
            .eq("id",message.id)
            .eq("username",username);

        if(error){
            console.error("Error haciendo soft delete:",error);
            element.classList.remove("is-fading");
            alert(
                "No se pudo desvanecer el mensaje.\n\n"+
                error.message+
                "\n\nSi aparece un error de permisos, necesitas una política UPDATE en Supabase."
            );
            return;
        }

        if(parsed.image){
            await deleteStorageImage(parsed.image);
        }

        await replaceWithDeletedMessage(element,message);

        showNotificationStatus("✦ El mensaje se desvaneció");

    }catch(error){
        console.error(error);
        element.classList.remove("is-fading");
        alert(
            "Ocurrió un error al desvanecer el mensaje.\n\n"+
            error.message
        );
    }
}

function replaceWithDeletedMessage(element,message){
    return new Promise(resolve=>{
        setTimeout(()=>{
            element.className="message is-deleted";
            element.innerHTML="";

            const deletedWrap=document.createElement("div");
            deletedWrap.className="deleted-message";

            const icon=document.createElement("span");
            icon.className="deleted-icon";
            icon.textContent="✦";

            const text=document.createElement("span");
            text.textContent="Este mensaje se desvaneció entre las estrellas";

            const time=document.createElement("span");
            time.className="deleted-time";
            time.textContent=formatMessageTime(message.created_at);

            deletedWrap.append(icon,text,time);
            element.appendChild(deletedWrap);
            resolve();
        },1150);
    });
}

===================================== */

async function deleteStorageImage(
    imageUrl
){

    try{

        const marker =
            "/storage/v1/object/public/"+
            STORAGE_BUCKET+
            "/";

        const index =
            imageUrl.indexOf(marker);

        if(index===-1){
            return;
        }

        const filePath =
            decodeURIComponent(
                imageUrl.slice(
                    index+marker.length
                )
            );

        if(!filePath){
            return;
        }

        await supabaseClient
            .storage
            .from(STORAGE_BUCKET)
            .remove([filePath]);

    }catch(error){

        console.warn(
            "Error eliminando imagen:",
            error
        );
    }
}

async function requestNotificationPermission(){

    if(!("Notification" in window)){
        return;
    }

    if(
        Notification.permission==="default"
    ){

        try{

            const permission =
                await Notification.requestPermission();

            if(permission==="granted"){

                showNotificationStatus(
                    "🔔 Notificaciones activadas"
                );
            }

        }catch(error){

            console.warn(error);

        }
    }
}

function showNotificationStatus(text){

    notificationStatus.textContent=text;

    showNotificationStatus.timer =
        setTimeout(
            ()=>{

}

            :"Nuevo mensaje"
        );

    if(

    ){

        body =
            "↩ Respondió a "+
            parsed.reply.username+
            ": "+
            body;
    }

    if(body.length>100){
        body=body.slice(0,97)+"...";
    }

    try{

        const notification =
            new Notification(
                "Mi otra mitad · "+
                message.username,
                {
                    body:body,
                    tag:"chat-"+chatId
                }
            );

        notification.onclick=()=>{
            window.focus();
            notification.close();
        };

    }catch(error){

        console.warn(error);

    }
}

function flashDocumentTitle(){

    clearInterval(titleFlashTimer);

    let visible=false;
    let count=0;

    titleFlashTimer =
        setInterval(
            ()=>{
                visible=!visible;
                count++;

                document.title =
                    visible
                    ?"💙 Nuevo mensaje"
                    :notificationTitle;

                if(count>=8){

                    clearInterval(
                        titleFlashTimer
                    );

                    document.title=
                        notificationTitle;
                }

            },
            700
        );
}


/* =====================================
   REALTIME MENSAJES
===================================== */

function subscribeToMessages(){

    supabaseClient
        .channel(
            "messages-"+chatId
        )

        .on(
            "postgres_changes",
            {
                event:"INSERT",
                schema:"public",
                table:"messages",
                filter:
                    "chat_id=eq."+chatId
            },
            payload=>{
                addMessageToScreen(
                    payload.new,
                    true
                );
            }
        )

        .on(
            "postgres_changes",
            {
                event:"UPDATE",
                schema:"public",
                table:"messages",
                filter:
                    "chat_id=eq."+chatId
            },
            payload=>{
                const updated=payload.new;
                if(!updated || !updated.id){
                    return;
                }

                const existing=messages.querySelector(
                    `[data-message-id="${updated.id}"]`
                );

                const parsed=parseStoredMessage(updated.message);

                if(parsed.deleted){
                    if(existing){
                        existing.classList.remove("is-deleted");
                        existing.classList.add("is-fading");
                        setTimeout(()=>{
                            replaceWithDeletedMessage(existing,updated);
                        },80);
                    }else{
                        addMessageToScreen(updated,false);
                    }
                }
            }
        )

        // Compatibilidad: si alguna fila se elimina desde otro sitio,
        // la quitamos de la pantalla sin romper el chat.
        .on(
            "postgres_changes",
            {
                event:"DELETE",
                schema:"public",
                table:"messages",
                filter:
                    "chat_id=eq."+chatId
            },
            payload=>{
                if(!payload.old){
                    return;
                }
                const deleted=messages.querySelector(
                    `[data-message-id="${payload.old.id}"]`
                );
                if(deleted){
                    deleted.remove();
                }
            }
        )

        .subscribe(
            status=>{
                console.log(
                    "Estado Realtime:",
                    status
                );
            }
        );
}


/* =====================================
   AUDIO CHANNEL
===================================== */

async function setupAudioChannel(){

    audioChannel =
        supabaseClient.channel(
            "audio-"+chatId,
            {
                config:{
                    presence:{
                        key:
                            crypto.randomUUID()
                    }
                }
            }
        );

    audioChannel

        .on(
            "presence",
            {event:"sync"},
            handlePresenceSync
        )

        .on(
            "presence",
            {event:"join"},
            handlePresenceJoin
        )

        .on(
            "broadcast",
            {event:"webrtc"},
            async({payload})=>{
                if(payload){
                    await handleWebRTCSignal(
                        payload
                    );
                }
            }
        );

    await audioChannel.subscribe(
        async status=>{

            if(status==="SUBSCRIBED"){

                await audioChannel.track({
                    username:username,
                    joinedAt:Date.now()
                });

                setAudioStatus(
                    "Audio listo · micrófono apagado"
                );
            }
        }
    );
}

function getPresenceCount(){

    if(!audioChannel){
        return 0;
    }

    const state =
        audioChannel.presenceState();

    return Object.keys(state).length;
}

async function handlePresenceSync(){

    remotePeerPresent =
        getPresenceCount()>1;

    if(
        remotePeerPresent &&
        audioStarted
    ){

        await ensurePeerConnection();

        if(!makingOffer){
            await createOffer();
        }
    }
}

async function handlePresenceJoin(){

    remotePeerPresent=true;

    if(audioStarted){

        await ensurePeerConnection();

        if(!makingOffer){
            await createOffer();
        }
    }
}


/* =====================================
   PEER CONNECTION
===================================== */

async function ensurePeerConnection(){

    if(peerConnection){
        return peerConnection;
    }

    peerConnection =
        new RTCPeerConnection(
            rtcConfig
        );

    peerConnection.onicecandidate =
        async event=>{

            if(event.candidate){

                await sendSignal({
                    type:"candidate",
                    candidate:event.candidate
                });
            }
        };

    peerConnection.ontrack =
        async event=>{

            const track = event.track;

            if(track.kind==="video"){

                let stream = remoteVideo.srcObject;

                if(!stream){
                    stream = new MediaStream();
                    remoteVideo.srcObject = stream;
                }

                if(!stream.getTracks().some(
                    existing=>existing.id===track.id
                )){
                    stream.addTrack(track);
                }

                remoteVideoCard.classList.add("visible");
                videoPanel.classList.add("show");

                try{
                    await remoteVideo.play();
                }catch(error){
                    console.warn("El navegador bloqueó el video:",error);
                }

                track.onended=()=>{
                    stream.removeTrack(track);
                    if(!stream.getVideoTracks().length){
                        remoteVideoCard.classList.remove("visible");
                        if(!cameraStarted){
                            videoPanel.classList.remove("show");
                        }
                    }
                };

                setAudioStatus(
                    audioStarted
                    ?"🎙️ Micrófono activo · 📷 video conectado"
                    :"📷 Video conectado · micrófono apagado",
                    audioStarted
                );

                return;
            }

            if(event.streams && event.streams[0]){
                remoteAudio.srcObject = event.streams[0];
            }else{
                remoteAudio.srcObject = new MediaStream([track]);
            }

            try{
                await remoteAudio.play();
            }catch(error){
                console.warn("El navegador bloqueó el audio:",error);
            }

            setAudioStatus("🔊 Audio conectado",true);
        };

    peerConnection.onconnectionstatechange =
        ()=>{

            if(!peerConnection){
                return;
            }

            const state =
                peerConnection.connectionState;

            if(state==="connected"){

                setAudioStatus(
                    audioStarted
                    ?"🎙️ Micrófono activo · 🔊 audio conectado"
                    :"🔊 Audio conectado · micrófono apagado",
                    audioStarted
                );
            }

            if(
                state==="failed" ||
                state==="disconnected"
            ){

                setAudioStatus(
                    "Reconectando audio..."
                );
            }
        };

    if(localStream){

        localStream
            .getTracks()
            .forEach(track=>{

                peerConnection.addTrack(
                    track,
                    localStream
                );
            });
    }

    return peerConnection;
}


/* =====================================
   MICROFONO
===================================== */

async function getLocalMicrophone(){

    if(localAudioTrack){
        return localStream;
    }

    try{

        const microphoneStream =
            await navigator.mediaDevices.getUserMedia({
                audio:{
                    echoCancellation:true,
                    noiseSuppression:true,
                    autoGainControl:true
                },
                video:false
            });

        localAudioTrack =
            microphoneStream.getAudioTracks()[0];

        localAudioTrack.enabled=false;

        if(!localStream){
            localStream = new MediaStream();
        }

        localStream.addTrack(localAudioTrack);

        return localStream;

    }catch(error){

        console.error("Error micrófono:",error);

        if(error.name==="NotAllowedError"){
            alert("Necesitas permitir el micrófono en el navegador.");
        }else{
            alert("No se pudo acceder al micrófono.");
        }

        return null;
    }
}

async function getLocalCamera(){

    if(localVideoTrack){
        return localVideoTrack;
    }

    if(!navigator.mediaDevices ||
       !navigator.mediaDevices.getUserMedia){
        alert(
            "Tu navegador no permite usar la cámara aquí. Abre la página desde HTTPS, por ejemplo GitHub Pages."
        );
        return null;
    }

    try{

        const cameraStream =
            await navigator.mediaDevices.getUserMedia({
                video:{
                    facingMode:"user",
                    width:{ideal:1280},
                    height:{ideal:720}
                },
                audio:false
            });

        localVideoTrack =
            cameraStream.getVideoTracks()[0];

        if(!localVideoTrack){
            throw new Error("No se encontró una pista de cámara.");
        }

        if(!localStream){
            localStream = new MediaStream();
        }

        localStream.addTrack(localVideoTrack);

        localVideo.srcObject =
            new MediaStream([localVideoTrack]);

        videoPanel.classList.add("show");

        return localVideoTrack;

    }catch(error){

        console.error("Error cámara:",error);

        if(error.name==="NotAllowedError"){
            alert("Necesitas permitir la cámara en el navegador para compartir video.");
        }else if(error.name==="NotFoundError"){
            alert("No se encontró una cámara disponible.");
        }else if(error.name==="NotReadableError"){
            alert("La cámara está siendo usada por otra aplicación.");
        }else{
            alert("No se pudo acceder a la cámara.\n\n"+error.message);
        }

        return null;
    }
}

async function removeLocalCamera(){

    if(!localVideoTrack){
        return;
    }

    const oldTrack = localVideoTrack;
    oldTrack.stop();

    if(localStream){
        localStream.removeTrack(oldTrack);
    }

    const sender =
        peerConnection &&
        peerConnection.getSenders().find(
            item=>item.track &&
            item.track.id===oldTrack.id
        );

    if(sender){
        try{
            await sender.replaceTrack(null);
        }catch(error){
            console.warn("No se pudo retirar el video:",error);
        }
    }

    localVideoTrack=null;
    localVideo.srcObject=null;

    if(!remoteVideoCard.classList.contains("visible")){
        videoPanel.classList.remove("show");
    }

    if(peerConnection && remotePeerPresent){
        await createOffer();
    }
}

cameraButton.addEventListener(
    "click",
    async ()=>{

        if(!audioChannel){
            setAudioStatus("La conexión todavía está iniciándose...");
            return;
        }

        if(!cameraStarted){

            cameraButton.classList.add("waiting");

            const track =
                await getLocalCamera();

            cameraButton.classList.remove("waiting");

            if(!track){
                return;
            }

            await ensurePeerConnection();

            if(
                peerConnection &&
                !peerConnection.getSenders().some(
                    sender=>sender.track &&
                    sender.track.id===track.id
                )
            ){
                peerConnection.addTrack(track,localStream);
            }

            cameraStarted=true;

            cameraButton.classList.add("active");
            cameraButton.textContent="📹";
            cameraButton.title="Apagar cámara";

            if(remotePeerPresent){
                await createOffer();
            }

            setAudioStatus(
                remotePeerPresent
                ?"📷 Cámara activa · video conectado"
                :"📷 Cámara activa · esperando a la otra persona",
                true
            );

        }else{

            cameraStarted=false;

            await removeLocalCamera();

            cameraButton.classList.remove("active");
            cameraButton.textContent="📷";
            cameraButton.title="Activar cámara";

            setAudioStatus(
                audioStarted
                ?"🎙️ Micrófono activo"
                :"📷 Cámara apagada"
            );
        }
    }
);




/* =====================================
   BOTON DE LLAMADA
===================================== */

micButton.addEventListener(
    "click",
    async ()=>{

        if(!audioChannel){

            setAudioStatus(
                "El audio todavía está conectando..."
            );

            return;
        }

        if(!localStream){

            micButton.classList.add(
                "waiting"
            );

            const stream =
                await getLocalMicrophone();

            micButton.classList.remove(
                "waiting"
            );

            if(!stream){
                return;
            }

            await ensurePeerConnection();

            if(
                peerConnection &&
                localAudioTrack &&
                !peerConnection.getSenders().some(
                    sender=>sender.track &&
                    sender.track.id===localAudioTrack.id
                )
            ){
                peerConnection.addTrack(
                    localAudioTrack,
                    localStream
                );
            }
        }

        if(!localAudioTrack){
            return;
        }

        localAudioTrack.enabled =
            !localAudioTrack.enabled;

        audioStarted =
            localAudioTrack.enabled;

        if(audioStarted){

            micButton.classList.add(
                "active"
            );

            micButton.textContent="🎙️";

            micButton.title =
                "Apagar micrófono";

            setAudioStatus(
                remotePeerPresent
                ?"🎙️ Micrófono activo · 🔊 conectado"
                :"🎙️ Micrófono activo · esperando a la otra persona",
                true
            );

            if(remotePeerPresent){

                await ensurePeerConnection();

                if(!makingOffer){
                    await createOffer();
                }
            }

        }else{

            micButton.classList.remove(
                "active"
            );

            micButton.textContent="📞";

            micButton.title =
                "Activar micrófono";

            setAudioStatus(
                "🔇 Micrófono apagado"
            );
        }
    }
);


/* =====================================
   OFFER
===================================== */

async function createOffer(){

    if(
        !peerConnection ||
        !remotePeerPresent ||
        makingOffer
    ){
        return;
    }

    try{

        makingOffer=true;

        const offer =
            await peerConnection.createOffer();

        await peerConnection.setLocalDescription(
            offer
        );

        await sendSignal({
            type:"offer",
            description:
                peerConnection.localDescription
        });

    }catch(error){

        console.error(
            "Error creando offer:",
            error
        );

    }finally{

        makingOffer=false;
    }
}


/* =====================================
   WEBRTC SIGNAL
===================================== */

async function sendSignal(data){

    if(!audioChannel){
        return;
    }

    try{

        await audioChannel.send({
            type:"broadcast",
            event:"webrtc",
            payload:data
        });

    }catch(error){

        console.error(
            "Error señal WebRTC:",
            error
        );
    }
}

async function handleWebRTCSignal(payload){

    if(
        !payload ||
        !audioChannel
    ){
        return;
    }

    try{

        if(payload.type==="offer"){

            await ensurePeerConnection();

            await peerConnection.setRemoteDescription(
                new RTCSessionDescription(
                    payload.description
                )
            );

            const answer =
                await peerConnection.createAnswer();

            await peerConnection.setLocalDescription(
                answer
            );

            await sendSignal({
                type:"answer",
                description:
                    peerConnection.localDescription
            });

        }

        else if(payload.type==="answer"){

            if(!peerConnection){
                return;
            }

            await peerConnection.setRemoteDescription(
                new RTCSessionDescription(
                    payload.description
                )
            );
        }

        else if(payload.type==="candidate"){

            if(
                !peerConnection ||
                !payload.candidate
            ){
                return;
            }

            try{

                await peerConnection.addIceCandidate(
                    new RTCIceCandidate(
                        payload.candidate
                    )
                );

            }catch(error){

                console.warn(
                    "Error ICE:",
                    error
                );
            }
        }

    }catch(error){

        console.error(
            "Error WebRTC:",
            error
        );
    }
}

window.addEventListener(
    "beforeunload",
    ()=>{

        if(localStream){

            localStream
                .getTracks()
                .forEach(
                    track=>track.stop()
                );
        }

        if(peerConnection){
            peerConnection.close();
        }

        if(localVideoTrack){
            localVideoTrack.stop();
        }

        if(audioChannel){
            audioChannel.unsubscribe();
        }
    }
);

window.addEventListener(

    ()=>{

        clearInterval(
            titleFlashTimer
        );

        document.title=
            notificationTitle;
    }
);
